name: Codex validator safeguards proof

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TRUSTED_CODEX_REVIEW_ENABLED: ${{ vars.TRUSTED_CODEX_REVIEW_ENABLED }}

jobs:
  prepare:
    if: &authority github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.run_attempt == 1 && vars.TRUSTED_CODEX_REVIEW_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - &node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Seal synthetic validator controls without model or publisher credentials
        run: node worker/prove-review-validation.mjs prepare
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codex-validation-fixture
          path: ${{ runner.temp }}/codex-validation-fixture/
          retention-days: 1
          if-no-files-found: error

  verify:
    needs: prepare
    if: *authority
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - *checkout
      - *node
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codex-validation-fixture
          path: ${{ runner.temp }}/codex-validation-fixture/
      - name: Revalidate actual transferred artifacts and reject each negative control
        run: node worker/prove-review-validation.mjs verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codex-validation-proof
          path: ${{ runner.temp }}/codex-validation-proof.json
          retention-days: 14
          if-no-files-found: error
