name: Trusted review
run-name: Review ${{ github.event.pull_request.number }} head ${{ github.event.pull_request.head.sha }} base ${{ github.event.pull_request.base.sha }}

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

env:
  REVIEW_LABEL: review
  REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
  REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
  REVIEW_MERGE: ${{ github.event.pull_request.merge_commit_sha }}
  REVIEW_TRUSTED: ${{ github.sha }}
  PR: ${{ github.event.pull_request.number }}

concurrency:
  group: trusted-review-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'labeled' && github.event.action != 'unlabeled' }}

jobs:
  review-plan:
    if: ${{ !cancelled() && github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      labeled: ${{ steps.decision.outputs.labeled }}
      owed: ${{ steps.prepare.outputs.available == 'false' && 'true' || steps.decision.outputs.owed }}
      stage: ${{ steps.plan.outputs.stage }}
      areas: ${{ steps.plan.outputs.areas }}
      area-numbers: ${{ steps.plan.outputs.area-numbers }}
      count: ${{ steps.plan.outputs.count }}
      merge: ${{ steps.prepare.outputs.merge }}
      available: ${{ steps.prepare.outputs.available }}
    steps:
      - name: Decide whether to review
        id: decision
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          labeled=false
          if [ "$ACTION:$LABEL" = "labeled:$REVIEW_LABEL" ]; then
            labeled=true
          fi
          echo "labeled=$labeled" >> "$GITHUB_OUTPUT"
          case "$ACTION" in
            opened | ready_for_review) asked=true ;;
            *) asked=$labeled ;;
          esac
          reason=""
          owed=false
          if [ "$EVENT" != "pull_request_target" ]; then
            reason="only pull requests are reviewed"
          elif [ "$AUTHOR" = "dependabot[bot]" ]; then
            reason="Dependabot's pull requests aren't reviewed"
          elif [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Required review credentials are missing."
            exit 1
          elif [ "$asked" != "true" ]; then
            reason="a pull request is reviewed once it's ready, and again only when it's labeled $REVIEW_LABEL"
            owed=true
          elif [ "$IS_DRAFT" = "true" ]; then
            reason="a draft is reviewed once it's ready for review"
            owed=true
          fi
          echo "owed=$owed" >> "$GITHUB_OUTPUT"
          if [ -n "$reason" ]; then
            echo "::notice::Nothing was reviewed: $reason."
            echo "review=false" >> "$GITHUB_OUTPUT"
          else
            echo "review=true" >> "$GITHUB_OUTPUT"
          fi
      - &trusted-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - &trusted-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - &trusted-source
        name: Preserve the trusted source before checking out reviewed data
        run: |
          mkdir "$RUNNER_TEMP/trusted"
          git archive "$REVIEW_TRUSTED" | tar -x -C "$RUNNER_TEMP/trusted"
      - name: Prepare a fresh reviewed checkout
        id: prepare
        if: steps.decision.outputs.review == 'true'
        run: node "$RUNNER_TEMP/trusted/worker/trusted-review.mjs" prepare
      # The review guide comes from the default branch, so a pull request can't change what its
      # reviewers look for.
      - name: Split the change into areas, and write what the reviewers read
        id: plan
        if: steps.decision.outputs.review == 'true' && steps.prepare.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.pull_request.title }}
          DESCRIPTION: ${{ github.event.pull_request.body }}
        run: |
          node "$RUNNER_TEMP/trusted/worker/trusted-review.mjs" plan >> "$GITHUB_OUTPUT"
      - if: steps.decision.outputs.review == 'true' && steps.prepare.outputs.available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trusted-review-plan
          path: ${{ env.REVIEW_UPLOAD }}/trusted-review-plan/
          include-hidden-files: true
          retention-days: 14
          overwrite: true

  # Consumes the label even without a merge, so the next ask starts a fresh run. It runs none of
  # the pull request's code, since its token can write to the pull request. A label already gone
  # is what it wants, so a 404 passes.
  review-label:
    needs: review-plan
    if: ${{ !cancelled() && needs.review-plan.result == 'success' && needs.review-plan.outputs.labeled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Take off the review label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh api --method DELETE "repos/$REPO/issues/$PR/labels/$REVIEW_LABEL" --silent 2> removal-error.txt; then
            cat removal-error.txt
            grep -q "HTTP 404" removal-error.txt
          fi

  # Areas can finish independently before the check across them.
  review-area:
    needs: review-plan
    if: ${{ !cancelled() && needs.review-plan.outputs.count > 0 }}
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.review-plan.outputs.areas || '[]') }}
    uses: ./.github/workflows/trusted-review-area.yml
    with:
      stage: ${{ needs.review-plan.outputs.stage }}
      area: ${{ fromJSON(needs.review-plan.outputs.area-numbers)[matrix.name] }}
      name: ${{ matrix.name }}
      merge: ${{ needs.review-plan.outputs.merge }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  # Confirms each problem the areas' reviewers listed against the code, merges repeats in one area
  # or across them, and weighs each, before anything is posted, and adds what no one area can see:
  # a change one area's files rely on in another's, the same fix due in the other app, and one
  # fact or rule now in two places. It leaves its answer for the posting step.
  review-across:
    needs: [review-plan, review-area]
    if: ${{ !cancelled() && needs.review-area.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
    env:
      REVIEW_MERGE: ${{ needs.review-plan.outputs.merge }}
      STAGE: ${{ needs.review-plan.outputs.stage }}
    steps:
      - *trusted-checkout
      - *trusted-node
      - *trusted-source
      - &prepare-reviewed
        name: Prepare a fresh reviewed checkout
        id: prepare
        if: needs.review-plan.outputs.available == 'true'
        run: node "$RUNNER_TEMP/trusted/worker/trusted-review.mjs" prepare
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: trusted-review-plan
          path: ${{ runner.temp }}/review-input/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: trusted-review-find-*
          path: ${{ runner.temp }}/review-input/
      - name: Validate the plan and reviewer artifacts
        run: node "$RUNNER_TEMP/trusted/worker/trusted-review.mjs" import "$RUNNER_TEMP/review-input"
      - name: Gather the reviewers' candidates
        run: node "$RUNNER_TEMP/trusted/worker/trusted-review.mjs" candidates
      - name: Check across the areas
        id: across
        continue-on-error: true
        timeout-minutes: 30
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          show_full_output: false
          settings: '{"disableAllHooks": true}'
          claude_args: |
            --model claude-opus-5-5
            --max-turns 200
            --setting-sources user
            --tools "Read,Bash"
            --add-dir ${{ env.REVIEW_DATA }}
            --strict-mcp-config
            --mcp-config '{"mcpServers":{}}'
            --allowedTools "Bash(node ${{ runner.temp }}/trusted/worker/review-git.mjs:*)"
            --json-schema '{"type":"object","properties":{"findings":{"type":"array","items":{"type":"object","properties":{"ids":{"type":"array","items":{"type":"string"}},"verdict":{"type":"string","enum":["confirmed","rejected","unsure"]},"weight":{"type":"string","enum":["Important","Nit","Pre-existing"]},"path":{"type":"string"},"line":{"type":"integer"},"body":{"type":"string"},"why":{"type":"string"}},"required":["ids","verdict","weight","path","line","body","why"]}},"unjudged":{"type":"array","items":{"type":"object","properties":{"file":{"type":"string"},"why":{"type":"string"}},"required":["file","why"]}}},"required":["findings","unjudged"]}'
          prompt: |
            You check what the reviewers of pull request #${{ github.event.pull_request.number }} in ${{ github.repository }} found, across every area of its change, before anything is posted. Its change is split into areas by what the files are about, and one reviewer read each area and listed every problem it found, unsure ones included. Their candidates are in `.review/candidates.json`, each with an id.

            1. Read `.review/REVIEW.md`, the review guide as the default branch has it, and `.review/AGENTS.md`, each whole. AGENTS.md and the rule files `.review/${{ env.STAGE }}.md` lists for each area hold the rules the code keeps.
            2. Read `.review/pull-request.md`, with the pull request's description and every review thread on it so far, `.review/${{ env.STAGE }}.md`, which lists each area's diff files and rule files, which you read as you need, and `.review/candidates.json`.
            3. Check each candidate's claim against the code: read the lines it names, trace the path from a real caller or input to what goes wrong, and see what the base did with `node ${{ runner.temp }}/trusted/worker/review-git.mjs show HEAD^1:<path>`. Use Read, which reaches only this checkout. Search and history come from `node ${{ runner.temp }}/trusted/worker/review-git.mjs`, which runs git grep, git log, or git show: `node ${{ runner.temp }}/trusted/worker/review-git.mjs grep -n -F -e <text> -- <path>` finds text in tracked checkout files, and `node ${{ runner.temp }}/trusted/worker/review-git.mjs grep -l -i -w -E -e <pattern> -- <path>` lists matching files. Search takes `-n`, `-l`, `-i`, `-w`, `-F`, `-E`, and one or more `-e <pattern>` arguments; paths follow `--`. History's base is HEAD^1: `node ${{ runner.temp }}/trusted/worker/review-git.mjs log -p -- <path>` for a file's changes, `node ${{ runner.temp }}/trusted/worker/review-git.mjs log -L<start>,<end>:<path>` or `node ${{ runner.temp }}/trusted/worker/review-git.mjs log -L:<function>:<path>` for a range's or a function's, `node ${{ runner.temp }}/trusted/worker/review-git.mjs show HEAD^1:<path>` for the base's copy, and `node ${{ runner.temp }}/trusted/worker/review-git.mjs show --diff-merges=first-parent HEAD -- <path>` for a file's whole change. It refuses options other than those its usage lists and any path outside this checkout. Run each command on its own, with no pipes or redirects.
            4. Give each a verdict. Confirmed: the code does what it says, and it matters as the guide weighs it. Rejected: the claim is wrong, the path can't happen, a thread already raised it and its answer holds, or it's a matter of taste. The guide's numbered items are never taste: a rule now in two places, a leftover, or a doc the change makes wrong is a finding whenever the code shows it. Unsure: it would matter and you can't settle it; say what would.
            5. Merge candidates that are the same problem into one finding, in one area or across areas, whether they name one place or several, naming every id it merges: one problem is one finding, however many places it shows, in both apps too. Every candidate's id appears in exactly one finding, rejected ones too: a step after you checks.
            6. Look for what no one area could see: a change in one area that another area's files rely on, the same fix due in the other app or another view, one fact or rule now in two places across areas, and docs or comments a change makes wrong. Check each the same way, and add each you confirm or can't settle that no candidate already says as a finding of its own, with no ids.
            7. Weigh each as the guide's "How to report" says.
            8. Write each finding's body as the guide's "How to report" says, without its weight, which a later step adds, naming every place it shows. Put it on the line the diff changes nearest its first place, naming that place if it's another.
            9. Post nothing. End with your answer: every finding, rejected ones too, and anything you couldn't judge from the code, and why.
      - name: Keep the check's answer
        id: keep
        if: steps.across.outcome == 'success'
        env:
          STRUCTURED_OUTPUT: ${{ steps.across.outputs.structured_output }}
        run: node "$RUNNER_TEMP/trusted/worker/trusted-review.mjs" across >> "$GITHUB_OUTPUT"
      - if: steps.keep.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trusted-review-across
          path: ${{ env.REVIEW_UPLOAD }}/trusted-review-across/
          retention-days: 14
          overwrite: true
      # So that re-running the failed jobs checks across the areas again. A check that didn't
      # finish keeps no answer, whose unchecked GitHub would compare as 0, so it fails here on that
      # alone.
      - name: Fail when the check across areas didn't finish
        if: steps.keep.outcome != 'success' || steps.keep.outputs.unchecked != '0'
        run: |
          echo "::error::The check across areas didn't finish, or left problems unchecked."
          exit 1

  # Posts what the check across areas confirmed or left unsure (worker/post-review.mjs). It's the
  # only review job but the summary that can write to the pull request, and runs no Claude.
  review-post:
    env:
      REVIEW_MERGE: ${{ needs.review-plan.outputs.merge }}
    needs: [review-plan, review-across]
    if: ${{ !cancelled() && needs.review-plan.outputs.count > 0 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - *trusted-checkout
      - *trusted-node
      - *trusted-source
      - *prepare-reviewed
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: trusted-review-@(plan|find-*|across|post)
          path: ${{ runner.temp }}/review-input/
      - name: Validate the artifacts before posting
        run: node "$RUNNER_TEMP/trusted/worker/trusted-review.mjs" import "$RUNNER_TEMP/review-input"
      - name: Post the findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/trusted/worker/trusted-review.mjs" post
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trusted-review-post
          path: ${{ env.REVIEW_UPLOAD }}/trusted-review-post/
          retention-days: 14
          overwrite: true

  # Fails a review that left anything due unread or unchecked, naming it in the one summary comment
  # it keeps up to date on the pull request. A run a newer push cancelled leaves the summary as it
  # was, until the review label asks again.
  review:
    env:
      REVIEW_MERGE: ${{ needs.review-plan.outputs.merge }}
    needs: [review-plan, review-area, review-across, review-post]
    if: ${{ !cancelled() && github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Fail when the review couldn't be planned
        if: needs.review-plan.result != 'success'
        run: |
          echo "::error::The review's plan didn't finish, so nothing was reviewed."
          exit 1
      - name: Leave an unavailable merge's review owed
        if: needs.review-plan.outputs.available == 'false'
        run: |
          echo "::notice::No matching merge was available, so review remains owed. Re-add the review label when the PR can merge."
          exit 1
      - *trusted-checkout
      - *trusted-node
      - *trusted-source
      - *prepare-reviewed
      - if: needs.review-plan.outputs.count != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: trusted-review-@(plan|find-*|across|post)
          path: ${{ runner.temp }}/review-input/
      - name: Validate the artifacts before summarizing
        if: needs.review-plan.outputs.count != ''
        run: node "$RUNNER_TEMP/trusted/worker/trusted-review.mjs" import "$RUNNER_TEMP/review-input"
      - name: Post the summary, and fail if anything due went unread or unchecked
        if: needs.review-plan.outputs.count != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/trusted/worker/trusted-review.mjs" summary
      - name: Record the trusted review result
        id: result
        if: needs.review-plan.outputs.owed == 'false' && steps.prepare.outputs.available == 'true'
        env:
          REVIEW_OWED: ${{ needs.review-plan.outputs.owed }}
        run: node "$RUNNER_TEMP/trusted/worker/trusted-review.mjs" result
      - if: steps.result.outputs.tree != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trusted-review-passed-${{ steps.result.outputs.tree }}
          path: ${{ env.REVIEW_UPLOAD }}/trusted-review-result/
          retention-days: 14
          overwrite: true
