name: Deploy

# Its own workflow, so pull requests don't list a deploy job that never runs for them.
on:
  push:
    branches: [main, beta]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  # To find a pull request's CI run that passed on main's exact code.
  actions: read

jobs:
  # A merge deploys at once when its pull request's CI passed on exactly the code main now has,
  # and otherwise once CI passes on main, unless nothing but docs, tests, and tooling changed
  # since the live version. A push to beta deploys the beta channel's Workers at once, to use a
  # change on a phone before it merges. The token lives in the production environment, which only
  # main and beta can use.
  deploy:
    if: github.event_name == 'push' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    # A workflow_run names main as its branch.
    env:
      CHANNEL: ${{ github.ref_name == 'beta' && 'beta' || 'production' }}
    # Each channel waits only on its own deploys, so a push to beta never cancels main's waiting one.
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      # All of main's history, so the merge can be compared with the live version's commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Find the pull request's CI run that passed on this code
        id: passed
        if: github.event_name == 'push' && env.CHANNEL == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node worker/find-passed-ci.mjs
      # CI already ran the tests on this code, and no package's install script runs where the
      # token is.
      - run: npm ci --ignore-scripts
        if: github.event_name != 'push' || env.CHANNEL == 'beta' || steps.passed.outputs.run
      # The deploy opens each new version's page in Chromium's headless shell, and puts the one
      # before back when it doesn't draw (worker/check-page.mjs).
      - id: browsers
        if: github.event_name != 'push' || env.CHANNEL == 'beta' || steps.passed.outputs.run
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: (github.event_name != 'push' || env.CHANNEL == 'beta' || steps.passed.outputs.run) && steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      # Secrets, so the account ID and each page's address and code are masked in this public log.
      - name: Deploy the Worker
        if: github.event_name != 'push' || env.CHANNEL == 'beta' || steps.passed.outputs.run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MLB_PAGE_URL: ${{ secrets.MLB_PAGE_URL }}
          MLB_ACCESS_CODE: ${{ secrets.MLB_ACCESS_CODE }}
          MLB_BETA_PAGE_URL: ${{ secrets.MLB_BETA_PAGE_URL }}
          MLB_BETA_ACCESS_CODE: ${{ secrets.MLB_BETA_ACCESS_CODE }}
          WNBA_PAGE_URL: ${{ secrets.WNBA_PAGE_URL }}
          WNBA_ACCESS_CODE: ${{ secrets.WNBA_ACCESS_CODE }}
          WNBA_BETA_PAGE_URL: ${{ secrets.WNBA_BETA_PAGE_URL }}
          WNBA_BETA_ACCESS_CODE: ${{ secrets.WNBA_BETA_ACCESS_CODE }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::No CLOUDFLARE_API_TOKEN in the production environment, so nothing was deployed."
            exit 0
          fi
          node worker/deploy.mjs --channel "$CHANNEL"
