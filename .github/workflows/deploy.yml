name: Deploy

# Its own workflow, so pull requests don't list a deploy job that never runs for them.
on:
  push:
    branches: [main, beta]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  # Passed CI and checked production receipts establish safe deployment and inherited coverage.
  actions: read
  # To find the pull request that holds beta: its labels, its timeline, which the issues scope
  # reads, and when its head was pushed, from its check suites.
  pull-requests: read
  issues: read
  checks: read

jobs:
  # A merge deploys at once when its pull request's CI passed on exactly the code main now has,
  # and otherwise once CI passes on main, unless nothing but docs, tests, and tooling changed
  # since the live version. A push to beta deploys the beta channel's Workers at once, to use a
  # change on a phone before it merges. Each channel has an environment of its own, which only its
  # branch can use, holding a token that can change only that channel's Workers, so a branch on
  # beta can never reach the live apps.
  deploy:
    if: github.event_name == 'push' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_name == 'beta' && 'beta' || 'production' }}
    # A workflow_run names main as its branch.
    env:
      CHANNEL: ${{ github.ref_name == 'beta' && 'beta' || 'production' }}
    # Each channel waits only on its own deploys, so a push to beta never cancels main's waiting one.
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    outputs:
      checked-commit: ${{ steps.deploy.outputs.checked-commit }}
    steps:
      # All of main's history, so the merge can be compared with the live version's commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          # The repository is public, so the deploy's fetches of main need no credentials.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Beta holds one pull request at a time, so a push to beta deploys only the head of the one
      # that holds it, and otherwise fails before anything deploys, keeping the build beta has
      # (worker/beta-claim.mjs). When GitHub can't say who holds beta, nothing deploys either.
      - name: Check that the pushed commit holds beta
        if: env.CHANNEL == 'beta'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node worker/beta-claim.mjs deploy "$GITHUB_SHA"
      - name: Find the pull request's CI run that passed on this code
        id: passed
        if: github.event_name == 'push' && env.CHANNEL == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node worker/find-passed-ci.mjs
      # CI already ran the tests on this code, and no package's install script runs where the
      # token is.
      - run: npm ci --ignore-scripts
        if: github.event_name != 'push' || env.CHANNEL == 'beta' || steps.passed.outputs.run
      # The deploy opens each new version's page in Chromium's headless shell, and puts the one
      # before back when it doesn't draw (worker/check-page.mjs).
      - id: browsers
        if: github.event_name != 'push' || env.CHANNEL == 'beta' || steps.passed.outputs.run
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: (github.event_name != 'push' || env.CHANNEL == 'beta' || steps.passed.outputs.run) && steps.browsers.outputs.cache-hit != 'true'
        run: node worker/install-browsers.mjs --only-shell chromium
      # Secrets, so the account ID, its workers.dev subdomain, and each page's address and code are
      # masked in this public log.
      - name: Deploy the Worker
        id: deploy
        if: github.event_name != 'push' || env.CHANNEL == 'beta' || steps.passed.outputs.run
        env:
          # Passed CI permits supersession; checked receipts permit inheriting production coverage.
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ secrets.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
          MLB_PAGE_URL: ${{ secrets.MLB_PAGE_URL }}
          MLB_BETA_PAGE_URL: ${{ secrets.MLB_BETA_PAGE_URL }}
          WNBA_PAGE_URL: ${{ secrets.WNBA_PAGE_URL }}
          WNBA_BETA_PAGE_URL: ${{ secrets.WNBA_BETA_PAGE_URL }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::No CLOUDFLARE_API_TOKEN in the $CHANNEL environment, so nothing was deployed."
            exit 1
          fi
          node worker/deploy.mjs --channel "$CHANNEL"
      # The CLI records coverage only after verification, never on a superseded early exit.
      - name: Record checked production commit
        if: steps.deploy.outputs.checked-commit
        env:
          TARGET_SHA: ${{ steps.deploy.outputs.checked-commit }}
        run: printf '%s\n' "$TARGET_SHA" > "$RUNNER_TEMP/production-checked.txt"
      - name: Keep checked production commit
        if: steps.deploy.outputs.checked-commit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: production-checked-${{ steps.deploy.outputs.checked-commit }}
          path: ${{ runner.temp }}/production-checked.txt
          overwrite: true
          retention-days: 90

  # Keeps one open issue while production's deploy fails, which closes once a run checks the live
  # apps (worker/report-deploy.mjs). Its own job, so the job that holds the Cloudflare token can't
  # write issues, and one whose failure leaves the run's conclusion to the deploy, which the
  # production receipts read.
  report:
    needs: deploy
    if: always() && github.ref_name != 'beta' && needs.deploy.result != 'skipped'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: node worker/report-deploy.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          JOB_RESULT: ${{ needs.deploy.result }}
          CHECKED_COMMIT: ${{ needs.deploy.outputs.checked-commit }}
