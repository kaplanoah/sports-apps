name: CI

# Every pull request is checked, including one stacked on another pull request's branch. A label
# change checks it again, so the phone-ok label lets a red change through without a push.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request stops the checks still running on the one before it. A label
# change waits for them instead, since it brings no new code and reuses what they find.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.action != 'unlabeled' }}

jobs:
  # On main, a pull request's CI that passed on exactly this code has already run every check, so
  # they're skipped. A label change brings no new code, so once a run passed every test on exactly
  # this code, only the gate runs again (worker/find-passed-ci.mjs).
  passed:
    if: github.event_name == 'push' || github.event.action == 'labeled' || github.event.action == 'unlabeled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - &setup-node
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Find the CI run that passed on this code
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SEARCH: ${{ github.event_name == 'pull_request' && '--tested' || '' }}
        run: node worker/find-passed-ci.mjs $SEARCH

  # A red change merges only once the owner has used it on the beta app and labeled it phone-ok
  # (worker/red-change.mjs), which reads the pull request's timeline for who added the label, and
  # the head commit's check suites for whether the label came after the head was pushed, so a push
  # after phone-ok holds the pull request again. The merge commit's first parent is the base branch.
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      # A pull request's timeline is an issue's, which the issues scope reads.
      issues: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - *setup-node
      # The gate parses a shared script's change with esbuild, to tell its code from its comments.
      - &restore-modules
        id: modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: &modules-key node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - &install-modules
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Hold a red change for the owner's phone
        shell: bash
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --no-renames HEAD^1 HEAD | node worker/red-change.mjs "$LABELS"

  # The quick checks share one machine, which leaves more of the account's runners for the browser
  # tests.
  checks:
    needs: passed
    if: ${{ !cancelled() && !needs.passed.outputs.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - *setup-node
      - *restore-modules
      - *install-modules
      # Each check runs even when one before it failed, so one run reports them all.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint
      - name: Check formatting
        if: ${{ !cancelled() }}
        run: npm run format:check
      - name: Check types
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: Find dead code
        if: ${{ !cancelled() }}
        run: npm run deadcode
      # The dot reporter prints each failure in full at the end of the run, where a reader of the
      # log's last lines finds it, while TAP's five lines a test put it thousands of lines back.
      - name: Test
        if: ${{ !cancelled() }}
        env: &test-reporter
          NODE_OPTIONS: --test-reporter=dot
        run: npm test
      # The runner is on UTC, ahead of MLB's Eastern day; this zone is behind it.
      - name: Test in another time zone
        if: ${{ !cancelled() }}
        env: *test-reporter
        run: TZ=Pacific/Honolulu npm test
      # A pull request's title sets the next version once it's squash merged (worker/release.mjs).
      # The title comes from GitHub rather than the event, so a re-run checks an edited title. The
      # files come from git, which lists a change of any size, where GitHub's diff stops at 20,000
      # lines; the merge commit's first parent is the base branch. Naming the shell adds pipefail,
      # so a failed diff can't pass as no changes.
      - name: Check the title
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: git diff --name-only --no-renames HEAD^1 HEAD | node worker/check-pr-title.mjs "$(gh pr view "$PR" --json title --jq .title)"

  # The browser tests take most of CI's time, so they run split across machines.
  browser:
    needs: passed
    if: ${{ !cancelled() && !needs.passed.outputs.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - *setup-node
      - *restore-modules
      - *install-modules
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: &browsers-key playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # The tests run on Chromium's headless shell, so the full browser isn't needed, and GitHub's
      # Ubuntu runners already have the system libraries it needs. Without WebKit installed, the
      # config leaves out the WebKit projects, which run in the webkit job.
      - &install-browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      # A failed try's trace leaves out the page at each step, a sixth of every test's time, which
      # burn-in and the nightly run keep.
      - run: npm run test:browser -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          TRACE_SNAPSHOTS: "off"
      - &find-flaky
        id: flaky
        if: ${{ !cancelled() && hashFiles('test-results/report.json') != '' }}
        run: echo "found=$(node -p 'require("./test-results/report.json").stats.flaky > 0')" >> "$GITHUB_OUTPUT"
      # A test that passed only on its retry keeps its failed try's trace, and the next nightly run
      # names it in the issue Flaky browser tests (worker/report-flaky-tests.mjs).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure() || steps.flaky.outputs.found == 'true'
        with:
          name: browser-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/

  # The browser specs a pull request adds or changes, which burn-in repeats, so it starts its
  # machines only when there are some. The merge commit's first parent is the base branch.
  changed-specs:
    needs: passed
    if: ${{ !cancelled() && github.event_name == 'pull_request' && !needs.passed.outputs.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      specs: ${{ steps.find.outputs.specs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      # Naming the shell adds pipefail, so a failed diff fails the job rather than reading as no
      # spec changed. A spec moved or split from another reads as added, so it's burned in too.
      - id: find
        shell: bash
        run: |
          specs=$(git diff --name-only --no-renames --diff-filter=AM HEAD^1 HEAD -- 'apps/*/tests/browser/*.spec.mjs' | tr '\n' ' ')
          echo "specs=$specs" >> "$GITHUB_OUTPUT"

  # A browser spec a pull request adds or changes runs ten times over, with no retry, so a test
  # that passes only some of the time fails on the pull request that brings it, rather than on
  # later ones. Only a test the pull request wrote or edited fails it: any other that failed goes
  # to the issue Flaky browser tests from the next nightly run (worker/judge-burn-in.mjs). Ten
  # runs of every spec a large pull request changes take longer than one machine's limit, so
  # they're split across machines too, and a machine whose share holds no test passes. It installs
  # WebKit too, as the webkit job does, so the at-rest specs repeat in WebKit, where they've failed
  # most.
  burn-in:
    needs: changed-specs
    if: ${{ !cancelled() && needs.changed-specs.result == 'success' && needs.changed-specs.outputs.specs != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - *setup-node
      - *restore-modules
      - *install-modules
      - run: npx playwright install --with-deps --only-shell chromium webkit
      # Every test runs all ten times, however many fail, and the next step decides which
      # failures fail the pull request, so a failed test doesn't fail this one.
      - name: Repeat each browser spec this pull request changes
        shell: bash
        env:
          SPECS: ${{ needs.changed-specs.outputs.specs }}
        run: |
          read -ra specs <<< "$SPECS"
          npm run test:browser -- --repeat-each=10 --retries=0 --max-failures=0 --pass-with-no-tests \
            --shard=${{ matrix.shard }}/${{ strategy.job-total }} "${specs[@]}" || true
      - name: Fail only on a test this pull request wrote or edited
        shell: bash
        run: git diff -U0 --no-renames HEAD^1 HEAD -- 'apps/*/tests/browser/*.spec.mjs' | node worker/judge-burn-in.mjs test-results/report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() && hashFiles('test-results/burn-in-flaky.json') != '' }}
        with:
          name: burn-in-flaky-${{ matrix.shard }}
          path: test-results/burn-in-flaky.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report-burn-in-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/

  # iPhones run the pages in WebKit, which runs only the at-rest specs, so one machine runs it. The
  # installed Playwright installs the WebKit it runs, with the system libraries GitHub's runners
  # lack, so the browser always matches the lockfile (tests/ci-workflow.test.js).
  webkit:
    needs: passed
    if: ${{ !cancelled() && !needs.passed.outputs.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - *setup-node
      - *restore-modules
      - *install-modules
      - run: npx playwright install --with-deps webkit
      - run: npm run test:browser -- --project '*-webkit'
      - *find-flaky
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure() || steps.flaky.outputs.found == 'true'
        with:
          name: browser-report-webkit
          path: |
            playwright-report/
            test-results/

  # A pull request can restore only the caches its own branch or main saved, so main saves any that
  # are missing, even when its checks are skipped. A failure here only costs pull requests their
  # cache, so it doesn't fail main's CI.
  caches:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - *setup-node
      - id: modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: *modules-key
          lookup-only: true
      - id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: *browsers-key
          lookup-only: true
      # Installing the browser takes the installed Playwright.
      - if: steps.modules.outputs.cache-hit != 'true' || steps.browsers.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: *modules-key
      - *install-browsers
      - if: steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: *browsers-key

  # Each pull request is reviewed in areas, by what its files are about, each test with its code
  # (worker/plan-review.mjs). In each area a reviewer for each kind of problem in KINDS reads every
  # line, listing every case of its kind; a checker confirms each case against the code; a check
  # across areas names repeats and looks for what spans them; and one step with no Claude posts
  # what the checkers confirmed or left unsure, less the repeats the check across areas named and
  # with what it added (worker/post-review.mjs), so no reviewer or checker can write to the pull
  # request. The first review reads the whole change. A review after it reads what the pushes since
  # the last full read changed, and when that finishes and posts nothing, the whole change is read
  # once more, by FINAL_KIND's reviewer. A run on the head the last full read ended on reads nothing
  # and leaves that read's summary as it is.
  # Review passes only once everything due was read and checked (worker/judge-review.mjs). With
  # nothing to review, such as a push to main, it plans nothing and passes, since check fails on a
  # skipped job. A label change brings no new code, so it reviews again only when no run passed
  # every test and the review on exactly this code.
  review-plan:
    needs: passed
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      stage: ${{ steps.plan.outputs.stage }}
      reviewers: ${{ steps.plan.outputs.reviewers }}
      checkers: ${{ steps.plan.outputs.checkers }}
      areas: ${{ steps.plan.outputs.areas }}
      count: ${{ steps.plan.outputs.count }}
      final-reviewers: ${{ steps.plan.outputs.final-reviewers }}
      final-checkers: ${{ steps.plan.outputs.final-checkers }}
      final-areas: ${{ steps.plan.outputs.final-areas }}
      final-count: ${{ steps.plan.outputs.final-count }}
    steps:
      - name: Decide whether to review
        id: decision
        env:
          EVENT: ${{ github.event_name }}
          PASSED_RUN: ${{ needs.passed.outputs.run }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          reason=""
          if [ "$EVENT" != "pull_request" ]; then
            reason="only pull requests are reviewed"
          elif [ -n "$PASSED_RUN" ]; then
            reason="a run on exactly this code already passed its review"
          elif [ "$IS_DRAFT" = "true" ]; then
            reason="a draft is reviewed once it's ready for review"
          elif [ "$AUTHOR" = "dependabot[bot]" ]; then
            reason="Dependabot's pull requests aren't reviewed"
          elif [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            reason="there's no CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret"
          fi
          if [ -n "$reason" ]; then
            echo "::notice::Nothing was reviewed: $reason."
            echo "review=false" >> "$GITHUB_OUTPUT"
          else
            echo "review=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.decision.outputs.review == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The whole history, to read since the last review's head and to look back as reviewers
          # do.
          fetch-depth: 0
          # Claude reads the checkout, and the review needs no git credentials on disk.
          persist-credentials: false
      - if: steps.decision.outputs.review == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      # The review guide comes from the default branch, so a pull request can't change what its
      # reviewers look for.
      - name: Split the change into areas, and write what the reviewers read
        id: plan
        if: steps.decision.outputs.review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          DESCRIPTION: ${{ github.event.pull_request.body }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node worker/plan-review.mjs .review >> "$GITHUB_OUTPUT"
          node worker/review-context.mjs .review
          git show "origin/$DEFAULT_BRANCH:REVIEW.md" > .review/REVIEW.md
      - if: steps.decision.outputs.review == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: review-plan
          path: .review/
          include-hidden-files: true
          retention-days: 14
          overwrite: true

  # A reviewer is told to read every line of its area's diffs, which a step then checks from the
  # reads it actually made, and a second try reads what the first left unread, or judges the whole
  # area again when the first gave no answer. The token is the run's own rather than Claude's
  # app's, which works only while this file is as the default branch has it, so a change to the
  # review is reviewed by its own jobs, and the guide has them flag one that lets less through.
  review-find:
    name: review-find (${{ matrix.name }}, ${{ matrix.kind }})
    needs: review-plan
    if: ${{ !cancelled() && needs.review-plan.outputs.count > 0 }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.review-plan.outputs.reviewers || '[]') }}
    env:
      STAGE: ${{ needs.review-plan.outputs.stage }}
    steps: &find-steps
      - &review-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - *setup-node
      - &download-plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-plan
          path: .review/
      - name: Review
        id: review
        continue-on-error: true
        timeout-minutes: 15
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: &oauth-token ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: &api-key ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: &run-token ${{ github.token }}
          show_full_output: true
          settings: &review-settings '{"disableAllHooks": true}'
          claude_args: &find-args |
            --model claude-opus-5-5
            --max-turns 150
            --allowedTools "Read,Grep,Glob,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git blame:*)"
            --json-schema '{"type":"object","properties":{"candidates":{"type":"array","items":{"type":"object","properties":{"path":{"type":"string"},"line":{"type":"integer"},"weight":{"type":"string","enum":["Important","Nit","Pre-existing"]},"confidence":{"type":"string","enum":["high","medium","low"]},"claim":{"type":"string"},"when":{"type":"string"},"fix":{"type":"string"}},"required":["path","line","weight","confidence","claim","when","fix"]}},"unjudged":{"type":"array","items":{"type":"object","properties":{"file":{"type":"string"},"why":{"type":"string"}},"required":["file","why"]}}},"required":["candidates","unjudged"]}'
          prompt: |
            You are a reviewer of pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}. Its change is split into areas by what the files are about, and each area's reviewers each look for one kind of problem. You review area ${{ matrix.area }}, "${{ matrix.name }}", and look only for this: ${{ matrix.focus }}

            1. Read `.review/REVIEW.md`, the review guide as the default branch has it, and follow it. AGENTS.md holds the rules the code keeps.
            2. Read `.review/pull-request.md`: the pull request's title and description, and every review thread on it so far, with its replies and whether it's resolved.
            3. Read `.review/${{ env.STAGE }}.md`, which lists each area's files and the diff files that hold their change. Read every diff file listed under Area ${{ matrix.area }}, each whole, with Read and no offset or limit, or, should Read say one is too big, in pieces with offset and limit that cover all of it. A step after you checks your reads, and the review fails on any line of your area's diffs you didn't read.
            4. Read what else you need to judge them: the files as the pull request leaves them, other areas' diffs, callers, and copies, with Read, Grep, and Glob, and history with git log, git show, git diff, and git blame, whose base is HEAD^1 and whose whole history is here. Run each command on its own, with no pipes or redirects.
            5. List every case of your kind of problem you find, not a sample, and each place it shows. Include a case you're unsure of, with your confidence: a checker confirms each against the code before anything is posted. Leave out a case a thread already raised, unless its reply is wrong or a fix it claims didn't hold, and then say so.
            6. Post nothing. End with your answer: each case, on a line the diff changes, nearest the one it's about, naming that one if it's another; and each file of your area you read but couldn't judge from the code, and why.
      - name: Find what the review left unread
        id: first
        if: ${{ !cancelled() }}
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          STRUCTURED_OUTPUT: ${{ steps.review.outputs.structured_output }}
          AREA: ${{ matrix.area }}
          KIND: ${{ matrix.kind }}
        run: node worker/judge-review.mjs find .review "$STAGE" "$AREA" "$KIND" >> "$GITHUB_OUTPUT"
      - name: Review what's left
        id: again
        if: &retry-due ${{ !cancelled() && steps.first.outcome == 'success' && (steps.first.outputs.unread != '' || steps.first.outputs.answered != 'true') }}
        continue-on-error: true
        timeout-minutes: 15
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: *oauth-token
          anthropic_api_key: *api-key
          github_token: *run-token
          show_full_output: true
          settings: *review-settings
          claude_args: *find-args
          prompt: |
            You are a reviewer of pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}. You review area ${{ matrix.area }}, "${{ matrix.name }}", and look only for this: ${{ matrix.focus }} An earlier try didn't finish. Diff files it left unread: ${{ steps.first.outputs.unread || 'none' }}. ${{ steps.first.outputs.answered == 'true' && 'Its answer is kept, so judge only what those files change.' || 'It gave no answer, so judge your whole area again.' }}

            1. Read `.review/REVIEW.md`, the review guide as the default branch has it, and follow it. AGENTS.md holds the rules the code keeps. `.review/pull-request.md` holds the pull request's description and every review thread on it.
            2. Read each diff file the earlier try left unread, under `.review/`, whole, with Read and no offset or limit, or, should Read say one is too big, in pieces with offset and limit that cover all of it. A step after you checks your reads, and the review fails on any line of them you didn't read. `.review/${{ env.STAGE }}.md` lists your area's diff files, to read as you need.
            3. Read what else you need, with Read, Grep, Glob, git log, git show, git diff, and git blame, whose base is HEAD^1. Run each command on its own, with no pipes or redirects.
            4. List every case of your kind of problem you find in what you judge, unsure ones too, with your confidence. Leave out a case a thread already raised, unless its reply is wrong or a fix it claims didn't hold.
            5. Post nothing. End with your answer: each case, on a line the diff changes, and each file you read but couldn't judge from the code, and why.
      - name: Find what's still unread
        id: last
        if: *retry-due
        env:
          EXECUTION_FILE: ${{ steps.again.outputs.execution_file }}
          STRUCTURED_OUTPUT: ${{ steps.again.outputs.structured_output }}
          AREA: ${{ matrix.area }}
          KIND: ${{ matrix.kind }}
        run: node worker/judge-review.mjs find .review "$STAGE" "$AREA" "$KIND" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: review-find-${{ env.STAGE }}-${{ matrix.area }}-${{ matrix.kind }}
          path: .review/find-${{ env.STAGE }}-${{ matrix.area }}-${{ matrix.kind }}.json
          retention-days: 14
          # A re-run of the job uploads its record again.
          overwrite: true
      # So that re-running the failed jobs reviews this area again.
      - name: Fail when parts are still unread or the reviewer gave no answer
        if: ${{ !cancelled() && (steps.last.outputs.unread != '' || steps.last.outputs.answered == 'false') }}
        run: |
          echo "::error::This reviewer didn't read every line of its area's diffs, or gave no answer."
          exit 1

  # Each area's checker confirms its reviewers' cases against the code, merges repeats, and weighs
  # each, before anything is posted.
  review-check:
    name: review-check (${{ matrix.name }})
    needs: [review-plan, review-find]
    if: ${{ !cancelled() && needs.review-plan.outputs.count > 0 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.review-plan.outputs.checkers || '[]') }}
    env:
      STAGE: ${{ needs.review-plan.outputs.stage }}
    steps: &check-steps
      - *review-checkout
      - *setup-node
      - *download-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: review-find-${{ env.STAGE }}-${{ matrix.area }}-*
          path: .review/
          merge-multiple: true
      - name: Gather the area's candidates
        id: gather
        env:
          AREA: ${{ matrix.area }}
        run: node worker/judge-review.mjs candidates .review "$STAGE" "$AREA" >> "$GITHUB_OUTPUT"
      # An area whose reviewers found nothing has nothing to check.
      - name: Check the candidates
        id: check
        if: steps.gather.outputs.count != '0'
        continue-on-error: true
        timeout-minutes: 20
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: *oauth-token
          anthropic_api_key: *api-key
          github_token: *run-token
          show_full_output: true
          settings: *review-settings
          claude_args: |
            --model claude-opus-5-5
            --max-turns 150
            --allowedTools "Read,Grep,Glob,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git blame:*)"
            --json-schema '{"type":"object","properties":{"findings":{"type":"array","items":{"type":"object","properties":{"ids":{"type":"array","items":{"type":"string"}},"verdict":{"type":"string","enum":["confirmed","rejected","unsure"]},"weight":{"type":"string","enum":["Important","Nit","Pre-existing"]},"path":{"type":"string"},"line":{"type":"integer"},"body":{"type":"string"},"why":{"type":"string"}},"required":["ids","verdict","weight","path","line","body","why"]}},"unjudged":{"type":"array","items":{"type":"object","properties":{"file":{"type":"string"},"why":{"type":"string"}},"required":["file","why"]}}},"required":["findings","unjudged"]}'
          prompt: |
            You check what the reviewers of one area of pull request #${{ github.event.pull_request.number }} in ${{ github.repository }} found, before anything is posted. Your area is ${{ matrix.area }}, "${{ matrix.name }}". Its reviewers each looked for one kind of problem and listed every case, unsure ones included. Their candidates are in `.review/candidates-${{ env.STAGE }}-${{ matrix.area }}.json`.

            1. Read `.review/REVIEW.md`, the review guide as the default branch has it. AGENTS.md holds the rules the code keeps.
            2. Read `.review/pull-request.md`, with the pull request's description and every review thread on it so far, and `.review/${{ env.STAGE }}.md`, which lists your area's diff files, and read those as you need.
            3. Check each candidate's claim against the code: read the lines it names, trace the path from a real caller or input to what goes wrong, and see what the base did with git show HEAD^1:<path>. Use Read, Grep, Glob, git log, git show, git diff, and git blame, each command on its own, with no pipes or redirects.
            4. Give each a verdict. Confirmed: the code does what it says, and it matters as the guide weighs it. Rejected: the claim is wrong, the path can't happen, a thread already raised it and its answer holds, or it's a matter of taste. The guide's numbered items are never taste: a rule now in two places, a leftover, or a doc the change makes wrong is a finding whenever the code shows it. Unsure: it would matter and you can't settle it; say what would.
            5. Merge candidates that are the same problem into one finding, naming every id it merges. Every candidate's id appears in exactly one finding, rejected ones too: a step after you checks.
            6. Weigh each as the guide says: Important for a bug, meaning a wrong result someone can see, wrong data kept, or a failure, and for a security hole or a broken AGENTS.md rule; Nit for something worth fixing that doesn't block; Pre-existing for a problem in code the change didn't make worse.
            7. Write each finding's body as the guide's "How to report" says: what is wrong, when it goes wrong, and how to fix it, in a few sentences, without its weight, which a later step adds. Put it on a line the diff changes, nearest the one it's about, naming that one if it's another.
            8. Post nothing. End with your answer: every finding, rejected ones too, and anything you couldn't judge from the code, and why.
      - name: Keep the checker's answer
        id: keep
        if: steps.check.outcome == 'success' || steps.gather.outputs.count == '0'
        env:
          STRUCTURED_OUTPUT: ${{ steps.check.outputs.structured_output }}
          AREA: ${{ matrix.area }}
        run: node worker/judge-review.mjs check .review "$STAGE" "$AREA" >> "$GITHUB_OUTPUT"
      - if: steps.keep.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: review-check-${{ env.STAGE }}-${{ matrix.area }}
          path: |
            .review/check-${{ env.STAGE }}-${{ matrix.area }}.json
            .review/candidates-${{ env.STAGE }}-${{ matrix.area }}.json
          retention-days: 14
          overwrite: true
      # So that re-running the failed jobs checks this area again. A check that didn't finish leaves
      # unchecked unset, so it fails here as one that left cases unchecked does.
      - name: Fail when the check didn't finish
        if: steps.keep.outputs.unchecked != '0'
        run: |
          echo "::error::This area's checker didn't finish, or left cases unchecked."
          exit 1

  # What no one area can see: a change one area's files rely on in another's, the same fix due in
  # the other app, and one fact or rule now in two places. It names only the repeats to merge and
  # what it adds, so no finding a checker kept drops out of its answer, and leaves its answer
  # for the posting step. A change of one area needs none.
  review-across:
    needs: [review-plan, review-check]
    if: ${{ !cancelled() && needs.review-check.result != 'skipped' && needs.review-plan.outputs.areas > 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      STAGE: ${{ needs.review-plan.outputs.stage }}
      AREAS: ${{ needs.review-plan.outputs.areas }}
    steps: &across-steps
      - *review-checkout
      - *setup-node
      - *download-plan
      - &download-checks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: review-check-${{ env.STAGE }}-*
          path: .review/
          merge-multiple: true
      - name: List the checkers' findings
        run: node worker/post-review.mjs list .review "$STAGE"
      - name: Check across the areas
        id: across
        continue-on-error: true
        timeout-minutes: 20
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: *oauth-token
          anthropic_api_key: *api-key
          github_token: *run-token
          show_full_output: true
          settings: *review-settings
          claude_args: |
            --model claude-opus-5-5
            --max-turns 150
            --allowedTools "Read,Grep,Glob,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git blame:*)"
            --json-schema '{"type":"object","properties":{"duplicates":{"type":"array","items":{"type":"array","items":{"type":"string"}}},"added":{"type":"array","items":{"type":"object","properties":{"weight":{"type":"string","enum":["Important","Nit","Pre-existing","Unsure"]},"path":{"type":"string"},"line":{"type":"integer"},"body":{"type":"string"}},"required":["weight","path","line","body"]}},"unjudged":{"type":"array","items":{"type":"object","properties":{"file":{"type":"string"},"why":{"type":"string"}},"required":["file","why"]}}},"required":["duplicates","added","unjudged"]}'
          prompt: |
            You make the last check of pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}'s review before its findings are posted. Its change is split into ${{ env.AREAS }} areas, and each area's checker checked what its reviewers found. Every finding they confirmed or left unsure is in `.review/checked-${{ env.STAGE }}.json`, each with a ref, and all of them are posted unless you name them as repeats.

            1. Read `.review/REVIEW.md`, the review guide as the default branch has it. AGENTS.md holds the rules the code keeps.
            2. Read `.review/pull-request.md`, with the pull request's description and every review thread on it, `.review/${{ env.STAGE }}.md`, which lists each area's diff files, and `.review/checked-${{ env.STAGE }}.json`.
            3. Name each group of findings from different areas that are the same problem, by their refs, the one that best shows it first: only the first of each group is posted, at the heaviest weight a checker settled in its group.
            4. Look for what no one area could see: a change in one area that another area's files rely on, the same fix due in the other app or another view, one fact or rule now in two places across areas, and docs or comments a change makes wrong. Check each against the code as a checker does, with Read, Grep, Glob, git log, git show, git diff, and git blame, each command on its own, with no pipes or redirects. Add each you confirm that no listed finding already says, on a line the diff changes, weighed as the guide says, its body saying what is wrong, when it goes wrong, and how to fix it, without its weight.
            5. Post nothing. End with your answer: the groups of repeats, the findings you add, and anything you couldn't judge from the code, and why.
      - name: Keep the check's answer
        if: steps.across.outcome == 'success'
        env:
          STRUCTURED_OUTPUT: ${{ steps.across.outputs.structured_output }}
        run: node worker/post-review.mjs across .review "$STAGE"
      - if: steps.across.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: review-across-${{ env.STAGE }}
          path: .review/across-${{ env.STAGE }}.json
          retention-days: 14
          overwrite: true
      # So that re-running the failed jobs checks across the areas again.
      - name: Fail when the check across areas didn't finish
        if: steps.across.outcome != 'success'
        run: |
          echo "::error::The check across areas didn't finish."
          exit 1

  # Posts what the checkers confirmed or left unsure, less the repeats the check across areas named
  # and with what it added (worker/post-review.mjs). It and its final twin are the only review jobs
  # but the summary that can write to the pull request, and run no Claude.
  review-post:
    needs: [review-plan, review-check, review-across]
    if: ${{ !cancelled() && needs.review-plan.outputs.count > 0 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    outputs:
      posted: ${{ steps.post.outputs.posted }}
    env:
      STAGE: ${{ needs.review-plan.outputs.stage }}
      AREAS: ${{ needs.review-plan.outputs.areas }}
    steps: &post-steps
      - *review-checkout
      - *setup-node
      - *download-plan
      - *download-checks
      - if: env.AREAS > 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-across-${{ env.STAGE }}
          path: .review/
      - name: Post the findings
        id: post
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: node worker/post-review.mjs post .review "$STAGE" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: review-post-${{ env.STAGE }}
          path: .review/post-${{ env.STAGE }}.json
          retention-days: 14
          overwrite: true

  # When a review of the pushes since the last full read finishes and posts nothing, the whole
  # change is read once more, by FINAL_KIND's reviewer in each area, to find what the earlier
  # reads missed, and the summary says what it found.
  review-final-find:
    name: review-final-find (${{ matrix.name }}, ${{ matrix.kind }})
    needs: [review-plan, review-find, review-check, review-post]
    if: &final-due ${{ !cancelled() && needs.review-plan.outputs.stage == 'push' && needs.review-find.result == 'success' && needs.review-check.result == 'success' && needs.review-post.outputs.posted == '0' && needs.review-plan.outputs.final-count > 0 }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.review-plan.outputs.final-reviewers || '[]') }}
    env:
      STAGE: final
    steps: *find-steps

  review-final-check:
    name: review-final-check (${{ matrix.name }})
    needs: [review-plan, review-find, review-check, review-post, review-final-find]
    if: *final-due
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.review-plan.outputs.final-checkers || '[]') }}
    env:
      STAGE: final
    steps: *check-steps

  review-final-across:
    needs: [review-plan, review-final-check]
    if: ${{ !cancelled() && needs.review-final-check.result != 'skipped' && needs.review-plan.outputs.final-areas > 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      STAGE: final
      AREAS: ${{ needs.review-plan.outputs.final-areas }}
    steps: *across-steps

  review-final-post:
    needs:
      [review-plan, review-find, review-check, review-post, review-final-check, review-final-across]
    if: *final-due
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      STAGE: final
      AREAS: ${{ needs.review-plan.outputs.final-areas }}
    steps: *post-steps

  # Fails a review that left anything due unread or unchecked, naming it in the one summary comment
  # it keeps up to date on the pull request. A run a newer push cancelled leaves the summary to the
  # newer push's run.
  review:
    needs:
      [
        review-plan,
        review-find,
        review-check,
        review-across,
        review-post,
        review-final-find,
        review-final-check,
        review-final-across,
        review-final-post,
      ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Fail when the review couldn't be planned
        if: needs.review-plan.result != 'success'
        run: |
          echo "::error::The review's plan didn't finish, so nothing was reviewed."
          exit 1
      - if: needs.review-plan.outputs.count != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: needs.review-plan.outputs.count != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - if: needs.review-plan.outputs.count != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: review-*
          path: .review/
          merge-multiple: true
      - name: Post the summary, and fail if anything due went unread or unchecked
        if: needs.review-plan.outputs.count != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: node worker/judge-review.mjs summary .review

  # The one check to require. It runs even when a job fails, because GitHub counts a
  # skipped required check as passing.
  check:
    if: always()
    needs:
      [
        passed,
        gate,
        checks,
        browser,
        changed-specs,
        burn-in,
        webkit,
        review-plan,
        review-find,
        review-check,
        review-across,
        review-post,
        review-final-find,
        review-final-check,
        review-final-across,
        review-final-post,
        review,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Every test passed when passed found a run that passed them on exactly this code, or when
      # every job but the gate passed.
      - name: Tell whether every test passed
        id: tested
        env:
          TESTED: >-
            ${{ needs.passed.outputs.run != '' || (needs.checks.result == 'success' &&
            needs.browser.result == 'success' && needs.webkit.result == 'success' &&
            needs.review.result == 'success' &&
            (github.event_name != 'pull_request' || needs.changed-specs.result == 'success') &&
            (needs.changed-specs.outputs.specs == '' || needs.burn-in.result == 'success')) }}
          # A draft's run passes without its review, which comes once it's ready on the same code, so
          # it doesn't stand in for one. Any other run skips a review that would never run.
          REVIEWED: >-
            ${{ needs.passed.outputs.run != '' || needs.review-plan.outputs.count != '' ||
            !github.event.pull_request.draft }}
        run: |
          echo "tested=$TESTED" >> "$GITHUB_OUTPUT"
          echo "reviewed=$REVIEWED" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      # Records the code this pull request's checks passed on: once every test and the review passed,
      # so a label change runs only the gate again, and once the gate passed too, so that once it merges, main
      # deploys at once if it has exactly that code (worker/find-passed-ci.mjs).
      - name: Record the code the checks ran on
        id: code
        if: github.event_name == 'pull_request'
        run: |
          git rev-parse HEAD > passed-commit.txt
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: >-
          github.event_name == 'pull_request' && steps.tested.outputs.tested == 'true' &&
          steps.tested.outputs.reviewed == 'true'
        with:
          name: ci-tested-${{ steps.code.outputs.tree }}
          path: passed-commit.txt
          retention-days: 14
      - name: Require every job to pass
        if: >-
          steps.tested.outputs.tested != 'true' ||
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
          (github.event_name == 'pull_request' && needs.gate.result != 'success')
        run: exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'pull_request'
        with:
          name: ci-passed-${{ steps.code.outputs.tree }}
          path: passed-commit.txt
          retention-days: 14
