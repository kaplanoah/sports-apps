name: CI

# Every pull request is checked, including one stacked on another pull request's branch. A label
# change checks it again, so the phone-ok label lets a red change through without a push.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request stops the checks still running on the one before it. A label
# change waits for them instead, since it brings no new code and reuses what they find.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.action != 'unlabeled' }}

jobs:
  # On main, a pull request's CI that passed on exactly this code has already run every check, so
  # they're skipped. A label change brings no new code, so once a run passed every test on exactly
  # this code, only the gate runs again (worker/find-passed-ci.mjs).
  passed:
    if: github.event_name == 'push' || github.event.action == 'labeled' || github.event.action == 'unlabeled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - &setup-node
        id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Find the CI run that passed on this code
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SEARCH: ${{ github.event_name == 'pull_request' && '--tested' || '' }}
        run: node worker/find-passed-ci.mjs $SEARCH

  # A red change merges only once the owner has used it on the beta app and labeled it phone-ok
  # (worker/red-change.mjs), which reads the pull request's events for who added the label. The
  # merge commit's first parent is the base branch.
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - *setup-node
      - name: Hold a red change for the owner's phone
        shell: bash
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: git diff --no-renames HEAD^1 HEAD | node worker/red-change.mjs "$LABELS"

  # The quick checks share one machine, which leaves more of the account's runners for the browser
  # tests.
  checks:
    needs: passed
    if: ${{ !cancelled() && !needs.passed.outputs.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - *setup-node
      - &restore-modules
        id: modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: &modules-key node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - &install-modules
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      # Each check runs even when one before it failed, so one run reports them all.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint
      - name: Check formatting
        if: ${{ !cancelled() }}
        run: npm run format:check
      - name: Check types
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: Find dead code
        if: ${{ !cancelled() }}
        run: npm run deadcode
      - name: Test
        if: ${{ !cancelled() }}
        run: npm test
      # The runner is on UTC, ahead of MLB's Eastern day; this zone is behind it.
      - name: Test in another time zone
        if: ${{ !cancelled() }}
        run: TZ=Pacific/Honolulu npm test
      # A pull request's title sets the next version once it's squash merged (worker/release.mjs).
      # The title comes from GitHub rather than the event, so a re-run checks an edited title.
      # Naming the shell adds pipefail, so a failed diff can't pass as no changes.
      - name: Check the title
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr diff "$PR" --name-only | node worker/check-pr-title.mjs "$(gh pr view "$PR" --json title --jq .title)"

  # The browser tests take most of CI's time, so they run split across machines.
  browser:
    needs: passed
    if: ${{ !cancelled() && !needs.passed.outputs.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - *setup-node
      - *restore-modules
      - *install-modules
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: &browsers-key playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # The tests run on Chromium's headless shell, so the full browser isn't needed, and GitHub's
      # Ubuntu runners already have the system libraries it needs. Without WebKit installed, the
      # config leaves out the WebKit projects, which run in the webkit job.
      - &install-browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      # A failed try's trace leaves out the page at each step, a sixth of every test's time, which
      # burn-in and the nightly run keep.
      - run: npm run test:browser -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          TRACE_SNAPSHOTS: "off"
      - &find-flaky
        id: flaky
        if: ${{ !cancelled() && hashFiles('test-results/report.json') != '' }}
        run: echo "found=$(node -p 'require("./test-results/report.json").stats.flaky > 0')" >> "$GITHUB_OUTPUT"
      # A test that passed only on its retry keeps its failed try's trace, and the check job names
      # it in the issue Flaky browser tests.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure() || steps.flaky.outputs.found == 'true'
        with:
          name: browser-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/

  # The browser specs a pull request adds or changes, which burn-in repeats, so it starts its
  # machines only when there are some. The merge commit's first parent is the base branch.
  changed-specs:
    needs: passed
    if: ${{ !cancelled() && github.event_name == 'pull_request' && !needs.passed.outputs.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      specs: ${{ steps.find.outputs.specs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      # Naming the shell adds pipefail, so a failed diff fails the job rather than reading as no
      # spec changed.
      - id: find
        shell: bash
        run: |
          specs=$(git diff --name-only --diff-filter=AM HEAD^1 HEAD -- 'apps/*/tests/browser/*.spec.mjs' | tr '\n' ' ')
          echo "specs=$specs" >> "$GITHUB_OUTPUT"

  # A browser spec a pull request adds or changes runs ten times over, with no retry, so a test
  # that passes only some of the time fails on the pull request that brings it, rather than on
  # later ones. Only a test the pull request wrote or edited fails it: any other that failed goes
  # to the issue Flaky browser tests from the check job (worker/judge-burn-in.mjs). Ten runs of
  # every spec a large pull request changes take longer than one machine's limit, so they're split
  # across machines too, and a machine whose share holds no test passes. It runs in Playwright's
  # own image, as the webkit job does, so the at-rest specs repeat in WebKit too, where they've
  # failed most.
  burn-in:
    needs: changed-specs
    if: ${{ !cancelled() && needs.changed-specs.result == 'success' && needs.changed-specs.outputs.specs != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - *setup-node
      - *restore-modules
      - *install-modules
      # Every test runs all ten times, however many fail, and the next step decides which
      # failures fail the pull request, so a failed test doesn't fail this one.
      - name: Repeat each browser spec this pull request changes
        shell: bash
        env:
          SPECS: ${{ needs.changed-specs.outputs.specs }}
        run: |
          read -ra specs <<< "$SPECS"
          npm run test:browser -- --repeat-each=10 --retries=0 --max-failures=0 --pass-with-no-tests \
            --shard=${{ matrix.shard }}/${{ strategy.job-total }} "${specs[@]}" || true
      # The image's user doesn't own the checkout, so git trusts it only once it's named safe.
      - name: Fail only on a test this pull request wrote or edited
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff -U0 --no-renames HEAD^1 HEAD -- 'apps/*/tests/browser/*.spec.mjs' | node worker/judge-burn-in.mjs test-results/report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() && hashFiles('test-results/burn-in-flaky.json') != '' }}
        with:
          name: burn-in-flaky-${{ matrix.shard }}
          path: test-results/burn-in-flaky.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report-burn-in-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/

  # iPhones run the pages in WebKit, which runs only the at-rest specs, so one machine runs it, in
  # Playwright's own image, which holds WebKit and the system libraries it needs rather than
  # installing them from a mirror on every run. Its tag is the Playwright version package.json pins
  # (tests/ci-workflow.test.js).
  webkit:
    needs: passed
    if: ${{ !cancelled() && !needs.passed.outputs.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - *setup-node
      - *restore-modules
      - *install-modules
      - run: npm run test:browser -- --project '*-webkit'
      - *find-flaky
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure() || steps.flaky.outputs.found == 'true'
        with:
          name: browser-report-webkit
          path: |
            playwright-report/
            test-results/

  # A pull request can restore only the caches its own branch or main saved, so main saves any that
  # are missing, even when its checks are skipped. A failure here only costs pull requests their
  # cache, so it doesn't fail main's CI.
  caches:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - *setup-node
      - id: modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: *modules-key
          lookup-only: true
      - id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: *browsers-key
          lookup-only: true
      # Installing the browser takes the installed Playwright.
      - if: steps.modules.outputs.cache-hit != 'true' || steps.browsers.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: *modules-key
      - *install-browsers
      - if: steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: *browsers-key

  # Reviews every push to a pull request, so fixes for its comments are reviewed too. It
  # passes when there's nothing to review, such as a push to main, since check fails on a
  # skipped job.
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    concurrency:
      group: review-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Decide whether to review
        id: decision
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          reason=""
          if [ "$EVENT" != "pull_request" ]; then
            reason="only pull requests are reviewed"
          elif [ "$ACTION" = "labeled" ] || [ "$ACTION" = "unlabeled" ]; then
            reason="a label change brings no new code"
          elif [ "$IS_DRAFT" = "true" ]; then
            reason="a draft is reviewed once it's ready for review"
          elif [ "$AUTHOR" = "dependabot[bot]" ]; then
            reason="Dependabot's pull requests aren't reviewed"
          elif [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            reason="there's no CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret"
          fi
          if [ -n "$reason" ]; then
            echo "::notice::Nothing was reviewed: $reason."
            echo "review=false" >> "$GITHUB_OUTPUT"
          else
            echo "review=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.decision.outputs.review == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          # Claude can read files, and the review needs no git credentials on disk.
          persist-credentials: false

      # A review takes about four minutes, so one still going at eight has stalled, and it gets
      # one more try. The full output logs each turn and tool call as it happens, so a stall shows
      # where it stopped; the review only reads this public repo and its pull request.
      - name: Review
        id: review
        if: steps.decision.outputs.review == 'true'
        continue-on-error: true
        timeout-minutes: 8
        uses: anthropics/claude-code-action@58985842b834ed26087302ba27d07bc24ca8697a # v1.0.244
        with: &review-inputs
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*)"
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            The PR branch is checked out in the working directory. Read the diff with `gh pr diff`,
            and read any surrounding code you need to judge it.

            Report only these five kinds of finding:

            1. Bugs: logic errors, unhandled edge cases, and broken assumptions that would make the
               code behave wrongly.
            2. AGENTS.md violations: any rule in AGENTS.md that the changed lines break.
            3. Security: unescaped text reaching the page, anything that weakens the APP_KEY
               check, and secrets, keys, account IDs, or real Worker addresses in code or docs.
            4. Missing tests, with a high bar: flag this only when the PR changes behavior a user
               would notice and the existing tests would still pass if that change were reverted.
               Never ask for tests of refactors, renames, comments, docs, styling, or
               configuration.
            5. Browser tests that would pass only some of the time: one that reads or measures the
               page right after an action without first waiting, with expect or expect.poll, for
               what that action shows; one that depends on how fast the machine is; or one that
               measures while a press, hover, transition, or scroll it started may still be going.

            This may not be the first review of this PR. Read the comments already on it with
            `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate`,
            and never post a finding that is already there, whether it was fixed, answered, or left open.

            Skip anything lint, Prettier, TypeScript, or knip already enforce, and anything that
            is a matter of taste. Only report what you are confident is real; when unsure, leave
            it out. Don't run the tests or other checks: this workflow's other jobs run them all,
            and a failure there fails the PR without you.

            Post each finding as an inline comment on the line it concerns, with confirmed=true.
            Say what is wrong, when it goes wrong, and how to fix it, in a few sentences.
            Don't post praise.

            Last, leave one summary comment, which replaces the one from your previous review:
            `gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body "<summary>"`.
            Start it with "Claude reviewed ${{ github.event.pull_request.head.sha }}:", then say
            how many findings you posted inline, or that you found none. If a tool you needed to
            read the PR or its code wasn't allowed, name it and say what you couldn't check.

      - name: Review again
        if: steps.review.outcome == 'failure'
        timeout-minutes: 8
        uses: anthropics/claude-code-action@58985842b834ed26087302ba27d07bc24ca8697a # v1.0.244
        with: *review-inputs

  # The one check to require. It runs even when a job fails, because GitHub counts a
  # skipped required check as passing.
  check:
    if: always()
    needs: [passed, gate, checks, browser, changed-specs, burn-in, webkit, review]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      # Every test passed when passed found a run that passed them on exactly this code, or when
      # every job but the gate passed.
      - name: Tell whether every test passed
        id: tested
        env:
          TESTED: >-
            ${{ needs.passed.outputs.run != '' || (needs.checks.result == 'success' &&
            needs.browser.result == 'success' && needs.webkit.result == 'success' &&
            needs.review.result == 'success' &&
            (github.event_name != 'pull_request' || needs.changed-specs.result == 'success') &&
            (needs.changed-specs.outputs.specs == '' || needs.burn-in.result == 'success')) }}
        run: echo "tested=$TESTED" >> "$GITHUB_OUTPUT"
      # Checks out even when a job failed, to name the tests its retry passed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
      # Records the code this pull request's checks passed on: once every test passed, so a label
      # change runs only the gate again, and once the gate passed too, so that once it merges, main
      # deploys at once if it has exactly that code (worker/find-passed-ci.mjs).
      - name: Record the code the checks ran on
        id: code
        if: github.event_name == 'pull_request'
        run: |
          git rev-parse HEAD > passed-commit.txt
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.event_name == 'pull_request' && steps.tested.outputs.tested == 'true'
        with:
          name: ci-tested-${{ steps.code.outputs.tree }}
          path: passed-commit.txt
          retention-days: 14
      - name: Require every job to pass
        if: >-
          steps.tested.outputs.tested != 'true' ||
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
          (github.event_name == 'pull_request' && needs.gate.result != 'success')
        run: exit 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.event_name == 'pull_request'
        with:
          name: ci-passed-${{ steps.code.outputs.tree }}
          path: passed-commit.txt
          retention-days: 14
      # The browser jobs' reports go to the issue from this one job, so two of them can't both
      # rewrite its table at once. Naming a flaky test never fails the pull request, whose own
      # token may not write issues, as Dependabot's can't.
      - id: node
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        with:
          pattern: browser-report-*
          path: browser-reports/
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        with:
          pattern: burn-in-flaky-*
          path: burn-in-flaky/
      # A test new to the issue starts the routine that fixes flaky tests, through its API trigger.
      - name: Name each test its retry passed, or burn-in found failing, in the issue Flaky browser tests
        if: ${{ always() && github.event_name == 'pull_request' && (hashFiles('browser-reports/**/report.json') != '' || hashFiles('burn-in-flaky/**/burn-in-flaky.json') != '') }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FLAKY_ROUTINE_URL: ${{ secrets.FLAKY_ROUTINE_URL }}
          FLAKY_ROUTINE_TOKEN: ${{ secrets.FLAKY_ROUTINE_TOKEN }}
        run: |
          shopt -s globstar nullglob
          listed=()
          for file in burn-in-flaky/**/burn-in-flaky.json; do listed+=(--listed "$file"); done
          node worker/report-flaky-tests.mjs --retried "${listed[@]}" browser-reports/**/report.json
