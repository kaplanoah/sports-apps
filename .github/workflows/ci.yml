name: CI

# Every pull request is checked, including one stacked on another pull request's branch. A label
# change checks it again, so the phone-ok label lets a red change through without a push.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request stops the checks still running on the one before it. A label
# change waits for them instead, since it brings no new code and reuses what they find.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.action != 'unlabeled' }}

jobs:
  # On main, a pull request's CI that passed on exactly this code has already run every check, so
  # they're skipped. A label change brings no new code, so once a run passed every test on exactly
  # this code, only the gate runs again (worker/find-passed-ci.mjs).
  passed:
    if: github.event_name == 'push' || github.event.action == 'labeled' || github.event.action == 'unlabeled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - &setup-node
        id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Find the CI run that passed on this code
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SEARCH: ${{ github.event_name == 'pull_request' && '--tested' || '' }}
        run: node worker/find-passed-ci.mjs $SEARCH

  # A red change merges only once the owner has used it on the beta app and labeled it phone-ok
  # (worker/red-change.mjs), which reads the pull request's events for who added the label. The
  # merge commit's first parent is the base branch.
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - *setup-node
      - name: Hold a red change for the owner's phone
        shell: bash
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: git diff --no-renames HEAD^1 HEAD | node worker/red-change.mjs "$LABELS"

  # The quick checks share one machine, which leaves more of the account's runners for the browser
  # tests.
  checks:
    needs: passed
    if: ${{ !cancelled() && !needs.passed.outputs.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - *setup-node
      - &restore-modules
        id: modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: &modules-key node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - &install-modules
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      # Each check runs even when one before it failed, so one run reports them all.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint
      - name: Check formatting
        if: ${{ !cancelled() }}
        run: npm run format:check
      - name: Check types
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: Find dead code
        if: ${{ !cancelled() }}
        run: npm run deadcode
      - name: Test
        if: ${{ !cancelled() }}
        run: npm test
      # The runner is on UTC, ahead of MLB's Eastern day; this zone is behind it.
      - name: Test in another time zone
        if: ${{ !cancelled() }}
        run: TZ=Pacific/Honolulu npm test
      # A pull request's title sets the next version once it's squash merged (worker/release.mjs).
      # The title comes from GitHub rather than the event, so a re-run checks an edited title.
      # Naming the shell adds pipefail, so a failed diff can't pass as no changes.
      - name: Check the title
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr diff "$PR" --name-only | node worker/check-pr-title.mjs "$(gh pr view "$PR" --json title --jq .title)"

  # The browser tests take most of CI's time, so they run split across machines.
  browser:
    needs: passed
    if: ${{ !cancelled() && !needs.passed.outputs.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - *setup-node
      - *restore-modules
      - *install-modules
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: &browsers-key playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # The tests run on Chromium's headless shell, so the full browser isn't needed, and GitHub's
      # Ubuntu runners already have the system libraries it needs. Without WebKit installed, the
      # config leaves out the WebKit projects, which run in the webkit job.
      - &install-browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      # A failed try's trace leaves out the page at each step, a sixth of every test's time, which
      # burn-in and the nightly run keep.
      - run: npm run test:browser -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          TRACE_SNAPSHOTS: "off"
      - &find-flaky
        id: flaky
        if: ${{ !cancelled() && hashFiles('test-results/report.json') != '' }}
        run: echo "found=$(node -p 'require("./test-results/report.json").stats.flaky > 0')" >> "$GITHUB_OUTPUT"
      # A test that passed only on its retry keeps its failed try's trace, and the check job names
      # it in the issue Flaky browser tests.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure() || steps.flaky.outputs.found == 'true'
        with:
          name: browser-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/

  # The browser specs a pull request adds or changes, which burn-in repeats, so it starts its
  # machines only when there are some. The merge commit's first parent is the base branch.
  changed-specs:
    needs: passed
    if: ${{ !cancelled() && github.event_name == 'pull_request' && !needs.passed.outputs.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      specs: ${{ steps.find.outputs.specs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      # Naming the shell adds pipefail, so a failed diff fails the job rather than reading as no
      # spec changed.
      - id: find
        shell: bash
        run: |
          specs=$(git diff --name-only --diff-filter=AM HEAD^1 HEAD -- 'apps/*/tests/browser/*.spec.mjs' | tr '\n' ' ')
          echo "specs=$specs" >> "$GITHUB_OUTPUT"

  # A browser spec a pull request adds or changes runs ten times over, with no retry, so a test
  # that passes only some of the time fails on the pull request that brings it, rather than on
  # later ones. Only a test the pull request wrote or edited fails it: any other that failed goes
  # to the issue Flaky browser tests from the check job (worker/judge-burn-in.mjs). Ten runs of
  # every spec a large pull request changes take longer than one machine's limit, so they're split
  # across machines too, and a machine whose share holds no test passes. It runs in Playwright's
  # own image, as the webkit job does, so the at-rest specs repeat in WebKit too, where they've
  # failed most.
  burn-in:
    needs: changed-specs
    if: ${{ !cancelled() && needs.changed-specs.result == 'success' && needs.changed-specs.outputs.specs != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - *setup-node
      - *restore-modules
      - *install-modules
      # Every test runs all ten times, however many fail, and the next step decides which
      # failures fail the pull request, so a failed test doesn't fail this one.
      - name: Repeat each browser spec this pull request changes
        shell: bash
        env:
          SPECS: ${{ needs.changed-specs.outputs.specs }}
        run: |
          read -ra specs <<< "$SPECS"
          npm run test:browser -- --repeat-each=10 --retries=0 --max-failures=0 --pass-with-no-tests \
            --shard=${{ matrix.shard }}/${{ strategy.job-total }} "${specs[@]}" || true
      # The image's user doesn't own the checkout, so git trusts it only once it's named safe.
      - name: Fail only on a test this pull request wrote or edited
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff -U0 --no-renames HEAD^1 HEAD -- 'apps/*/tests/browser/*.spec.mjs' | node worker/judge-burn-in.mjs test-results/report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() && hashFiles('test-results/burn-in-flaky.json') != '' }}
        with:
          name: burn-in-flaky-${{ matrix.shard }}
          path: test-results/burn-in-flaky.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report-burn-in-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/

  # iPhones run the pages in WebKit, which runs only the at-rest specs, so one machine runs it, in
  # Playwright's own image, which holds WebKit and the system libraries it needs rather than
  # installing them from a mirror on every run. Its tag is the Playwright version package.json pins
  # (tests/ci-workflow.test.js).
  webkit:
    needs: passed
    if: ${{ !cancelled() && !needs.passed.outputs.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - *setup-node
      - *restore-modules
      - *install-modules
      - run: npm run test:browser -- --project '*-webkit'
      - *find-flaky
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure() || steps.flaky.outputs.found == 'true'
        with:
          name: browser-report-webkit
          path: |
            playwright-report/
            test-results/

  # A pull request can restore only the caches its own branch or main saved, so main saves any that
  # are missing, even when its checks are skipped. A failure here only costs pull requests their
  # cache, so it doesn't fail main's CI.
  caches:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - *setup-node
      - id: modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: *modules-key
          lookup-only: true
      - id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: *browsers-key
          lookup-only: true
      # Installing the browser takes the installed Playwright.
      - if: steps.modules.outputs.cache-hit != 'true' || steps.browsers.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: *modules-key
      - *install-browsers
      - if: steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: *browsers-key

  # Each push to a pull request is reviewed in full, so fixes for its comments are reviewed too: its
  # change is split into shares small enough for one reviewer to read every line of
  # (worker/plan-review.mjs), one reviewer reads each share at once, one more checks across them,
  # and review passes only once every changed file was read (worker/judge-review.mjs). With nothing
  # to review, such as a push to main, it plans no shares and review passes, since check fails on a
  # skipped job. A label change brings no new code, so it reviews again only when no run passed
  # every test and the review on exactly this code.
  review-plan:
    needs: passed
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      shares: ${{ steps.plan.outputs.shares }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Decide whether to review
        id: decision
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PASSED_RUN: ${{ needs.passed.outputs.run }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          reason=""
          if [ "$EVENT" != "pull_request" ]; then
            reason="only pull requests are reviewed"
          elif [ -n "$PASSED_RUN" ]; then
            reason="a run on exactly this code already passed its review"
          elif [ "$IS_DRAFT" = "true" ]; then
            reason="a draft is reviewed once it's ready for review"
          elif [ "$AUTHOR" = "dependabot[bot]" ]; then
            reason="Dependabot's pull requests aren't reviewed"
          elif [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            reason="there's no CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret"
          fi
          if [ -n "$reason" ]; then
            echo "::notice::Nothing was reviewed: $reason."
            echo "review=false" >> "$GITHUB_OUTPUT"
          else
            echo "review=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.decision.outputs.review == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          # Claude reads the checkout, and the review needs no git credentials on disk.
          persist-credentials: false
      - if: steps.decision.outputs.review == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Split the change into shares
        id: plan
        if: steps.decision.outputs.review == 'true'
        run: node worker/plan-review.mjs .review >> "$GITHUB_OUTPUT"

  # A share's reviewer is told to read every line of its share's diffs, which a step then checks
  # from the reads it actually made, and a second try reads what the first left. The review guide
  # comes from the default branch, so a pull request can't change what its reviewers look for. The
  # token is the run's own rather than Claude's app's, which works only while this file is as the
  # default branch has it, so a change to the review is reviewed by its own jobs, and the guide
  # has them flag one that lets less through.
  review-share:
    needs: review-plan
    if: ${{ !cancelled() && needs.review-plan.outputs.count > 0 }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.review-plan.outputs.shares || '[]') }}
    steps:
      - &review-checkout-always
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - *setup-node
      - &prepare-review
        name: Write the change's diffs and the review guide
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node worker/plan-review.mjs .review > /dev/null
          git fetch --depth 1 origin "$DEFAULT_BRANCH"
          git show FETCH_HEAD:REVIEW.md > .review/REVIEW.md
      - &read-comments
        name: Write the comments already posted
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" --paginate \
            --jq '.[] | {path, line, author: .user.login, body}' > .review/comments.jsonl
      - name: Review
        id: review
        continue-on-error: true
        timeout-minutes: 15
        uses: anthropics/claude-code-action@58985842b834ed26087302ba27d07bc24ca8697a # v1.0.244
        with:
          claude_code_oauth_token: &oauth-token ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: &api-key ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: &run-token ${{ github.token }}
          show_full_output: true
          settings: &review-settings '{"disableAllHooks": true}'
          claude_args: &review-args |
            --model claude-opus-5-5
            --max-turns 150
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(git log:*),Bash(git show:*),Bash(git diff:*)"
            --json-schema '{"type":"object","properties":{"unjudged":{"type":"array","items":{"type":"object","properties":{"file":{"type":"string"},"why":{"type":"string"}},"required":["file","why"]}},"notes":{"type":"array","items":{"type":"string"}}},"required":["unjudged","notes"]}'
          prompt: |
            You are one of ${{ needs.review-plan.outputs.count }} reviewers of pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}, each reading one share of its change in full. You review share ${{ matrix.share }}.

            1. Read `.review/REVIEW.md`, the review guide as the default branch has it, and follow it. AGENTS.md holds the rules the code keeps.
            2. Read `.review/files.md`, which lists every changed file, the share that reviews it, and the diff files that hold its change.
            3. Read every diff file listed under Share ${{ matrix.share }}, each whole, with Read and no offset or limit, or, should Read say one is too big, in pieces with offset and limit that cover all of it. A step after you checks your reads, and the review fails on any line of your share's diffs you didn't read.
            4. Read what else you need to judge your share: the files as the pull request leaves them, other shares' diffs, callers, and copies, with Read, Grep, and Glob, and history with git log, git show, and git diff, whose base is HEAD^1. Run each command on its own, with no pipes or redirects.
            5. The comments already on the pull request are in `.review/comments.jsonl`. Never post a finding already there, whether it was fixed, answered, or left open.
            6. Post each finding as an inline comment on the line it's about, with confirmed=true, as the guide says.
            7. Don't post a summary: a later step writes it. End with your answer: each file of your share you read but couldn't judge from the code and why, and notes for the reviewer who checks across shares, like anything your share relies on or changes in another share's files or the other app.
      - name: Find what the review left unread
        id: first
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          STRUCTURED_OUTPUT: ${{ steps.review.outputs.structured_output }}
          SHARE: ${{ matrix.share }}
        run: node worker/judge-review.mjs share .review "$SHARE" >> "$GITHUB_OUTPUT"
      - *read-comments
      - name: Review what's left
        id: again
        if: always() && steps.first.outputs.unread != ''
        continue-on-error: true
        timeout-minutes: 15
        uses: anthropics/claude-code-action@58985842b834ed26087302ba27d07bc24ca8697a # v1.0.244
        with:
          claude_code_oauth_token: *oauth-token
          anthropic_api_key: *api-key
          github_token: *run-token
          show_full_output: true
          settings: *review-settings
          claude_args: *review-args
          prompt: |
            You are one of ${{ needs.review-plan.outputs.count }} reviewers of pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}, each reading one share of its change in full. You review share ${{ matrix.share }}, and an earlier try left these of its diff files unread: ${{ steps.first.outputs.unread }}

            1. Read `.review/REVIEW.md`, the review guide as the default branch has it, and follow it. AGENTS.md holds the rules the code keeps.
            2. Read each of those diff files, under `.review/`, whole, with Read and no offset or limit, or, should Read say one is too big, in pieces with offset and limit that cover all of it. A step after you checks your reads, and the review fails on any line of them you didn't read.
            3. Read what else you need to judge them, with Read, Grep, Glob, git log, git show, and git diff, whose base is HEAD^1. Run each command on its own, with no pipes or redirects.
            4. The comments already on the pull request, the earlier try's included, are in `.review/comments.jsonl`. Never post a finding already there.
            5. Post each finding as an inline comment on the line it's about, with confirmed=true, as the guide says.
            6. Don't post a summary: a later step writes it. End with your answer: each file you read but couldn't judge from the code and why, and notes for the reviewer who checks across shares.
      - name: Find what's still unread
        id: last
        if: always() && steps.first.outputs.unread != ''
        env:
          EXECUTION_FILE: ${{ steps.again.outputs.execution_file }}
          STRUCTURED_OUTPUT: ${{ steps.again.outputs.structured_output }}
          SHARE: ${{ matrix.share }}
        run: node worker/judge-review.mjs share .review "$SHARE" >> "$GITHUB_OUTPUT"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-share-${{ matrix.share }}
          path: .review/share-${{ matrix.share }}.json
          retention-days: 14
          # A re-run of the job uploads its record again.
          overwrite: true
      # So that re-running the failed jobs reviews this share again.
      - name: Fail when parts are still unread
        if: always() && steps.last.outputs.unread != ''
        run: |
          echo "::error::This share's reviewer didn't read every line of its diffs."
          exit 1

  # What no one share can see: a change one share's files rely on in another's, the same fix due in
  # the other app, and one fact or rule now in two places. A change of one share needs none.
  review-across:
    needs: [review-plan, review-share]
    if: ${{ !cancelled() && needs.review-plan.outputs.count > 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - *review-checkout-always
      - *setup-node
      - *prepare-review
      - *read-comments
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: review-share-*
          path: .review/
          merge-multiple: true
      - name: Review across the shares
        id: review
        continue-on-error: true
        timeout-minutes: 15
        uses: anthropics/claude-code-action@58985842b834ed26087302ba27d07bc24ca8697a # v1.0.244
        with:
          claude_code_oauth_token: *oauth-token
          anthropic_api_key: *api-key
          github_token: *run-token
          show_full_output: true
          settings: *review-settings
          claude_args: *review-args
          prompt: |
            You check pull request #${{ github.event.pull_request.number }} in ${{ github.repository }} as a whole, after ${{ needs.review-plan.outputs.count }} reviewers each read one share of it in full.

            1. Read `.review/REVIEW.md`, the review guide as the default branch has it, and follow it, and `.review/files.md`, which lists every changed file, its share, and its diff files.
            2. Each share's record is in `.review/share-<share>.json`. Read the notes and the files left unjudged in each of its tries' answers. Each share's findings are its comments in `.review/comments.jsonl`.
            3. Look for what no one share could see: a change in one share that another share's files rely on, the same fix due in the other app or another view, one fact or rule now in two places, and docs or comments a change makes wrong. Read the diffs and code you need with Read, Grep, Glob, git log, git show, and git diff, whose base is HEAD^1. Run each command on its own, with no pipes or redirects.
            4. The comments already on the pull request, the shares' included, are in `.review/comments.jsonl`. Never post a finding already there.
            5. Post each finding as an inline comment on the line it's about, with confirmed=true, as the guide says.
            6. Don't post a summary: a later step writes it. End with your answer: anything you couldn't judge from the code and why. Leave notes empty.
      - name: Keep the check's answer
        if: steps.review.outcome == 'success'
        env:
          STRUCTURED_OUTPUT: ${{ steps.review.outputs.structured_output }}
        run: node worker/judge-review.mjs across .review
      - if: steps.review.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-across
          path: .review/across.json
          retention-days: 14
          overwrite: true

  # Fails a review that left any changed file unread, naming each in the one summary comment it
  # keeps up to date on the pull request. A run a newer push cancelled leaves the summary to the
  # newer push's run.
  review:
    needs: [review-plan, review-share, review-across]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Fail when the review couldn't be planned
        if: needs.review-plan.result != 'success'
        run: |
          echo "::error::The review's plan didn't finish, so nothing was reviewed."
          exit 1
      - if: needs.review-plan.outputs.count != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - if: needs.review-plan.outputs.count != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - if: needs.review-plan.outputs.count != ''
        run: node worker/plan-review.mjs .review > /dev/null
      - if: needs.review-plan.outputs.count > 0
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: review-*
          path: .review/
          merge-multiple: true
      - name: Post the summary, and fail if anything went unread
        if: needs.review-plan.outputs.count != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: node worker/judge-review.mjs summary .review

  # The one check to require. It runs even when a job fails, because GitHub counts a
  # skipped required check as passing.
  check:
    if: always()
    needs:
      [
        passed,
        gate,
        checks,
        browser,
        changed-specs,
        burn-in,
        webkit,
        review-plan,
        review-share,
        review-across,
        review,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      # Every test passed when passed found a run that passed them on exactly this code, or when
      # every job but the gate passed.
      - name: Tell whether every test passed
        id: tested
        env:
          TESTED: >-
            ${{ needs.passed.outputs.run != '' || (needs.checks.result == 'success' &&
            needs.browser.result == 'success' && needs.webkit.result == 'success' &&
            needs.review.result == 'success' &&
            (github.event_name != 'pull_request' || needs.changed-specs.result == 'success') &&
            (needs.changed-specs.outputs.specs == '' || needs.burn-in.result == 'success')) }}
          # A draft's run passes without its review, which doesn't stand in for one.
          REVIEWED: ${{ needs.passed.outputs.run != '' || needs.review-plan.outputs.count != '' }}
        run: |
          echo "tested=$TESTED" >> "$GITHUB_OUTPUT"
          echo "reviewed=$REVIEWED" >> "$GITHUB_OUTPUT"
      # Checks out even when a job failed, to name the tests its retry passed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
      # Records the code this pull request's checks passed on: once every test and the review passed,
      # so a label change runs only the gate again, and once the gate passed too, so that once it merges, main
      # deploys at once if it has exactly that code (worker/find-passed-ci.mjs).
      - name: Record the code the checks ran on
        id: code
        if: github.event_name == 'pull_request'
        run: |
          git rev-parse HEAD > passed-commit.txt
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: >-
          github.event_name == 'pull_request' && steps.tested.outputs.tested == 'true' &&
          steps.tested.outputs.reviewed == 'true'
        with:
          name: ci-tested-${{ steps.code.outputs.tree }}
          path: passed-commit.txt
          retention-days: 14
      - name: Require every job to pass
        if: >-
          steps.tested.outputs.tested != 'true' ||
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
          (github.event_name == 'pull_request' && needs.gate.result != 'success')
        run: exit 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.event_name == 'pull_request'
        with:
          name: ci-passed-${{ steps.code.outputs.tree }}
          path: passed-commit.txt
          retention-days: 14
      # The browser jobs' reports go to the issue from this one job, so two of them can't both
      # rewrite its table at once. Naming a flaky test never fails the pull request, whose own
      # token may not write issues, as Dependabot's can't.
      - id: node
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        with:
          pattern: browser-report-*
          path: browser-reports/
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        with:
          pattern: burn-in-flaky-*
          path: burn-in-flaky/
      # A test new to the issue starts the routine that fixes flaky tests, through its API trigger.
      - name: Name each test its retry passed, or burn-in found failing, in the issue Flaky browser tests
        if: ${{ always() && github.event_name == 'pull_request' && (hashFiles('browser-reports/**/report.json') != '' || hashFiles('burn-in-flaky/**/burn-in-flaky.json') != '') }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FLAKY_ROUTINE_URL: ${{ secrets.FLAKY_ROUTINE_URL }}
          FLAKY_ROUTINE_TOKEN: ${{ secrets.FLAKY_ROUTINE_TOKEN }}
        run: |
          shopt -s globstar nullglob
          listed=()
          for file in burn-in-flaky/**/burn-in-flaky.json; do listed+=(--listed "$file"); done
          node worker/report-flaky-tests.mjs --retried "${listed[@]}" browser-reports/**/report.json
