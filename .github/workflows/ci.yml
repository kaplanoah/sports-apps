name: CI

# Every pull request is checked, including one stacked on another pull request's branch. A label
# change checks it again, so the phone-ok label lets a red change through without a push.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request stops the checks still running on the one before it. A label
# change waits for them instead, since it brings no new code and reuses what they find.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.action != 'unlabeled' }}

jobs:
  # On main, a pull request's CI that passed on exactly this code has already run every check, so
  # they're skipped. A label change brings no new code, so once a run passed every test on exactly
  # this code, only the gate runs again (worker/find-passed-ci.mjs).
  passed:
    if: github.event_name == 'push' || github.event.action == 'labeled' || github.event.action == 'unlabeled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - &setup-node
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Find the CI run that passed on this code
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SEARCH: ${{ github.event_name == 'pull_request' && '--tested' || '' }}
        run: node worker/find-passed-ci.mjs $SEARCH

  # A red change merges only once the owner has used it on the beta app and labeled it phone-ok
  # (worker/red-change.mjs), which reads the pull request's timeline for who added the label, and
  # the head commit's check suites for whether the label came after the head was pushed, so a push
  # after phone-ok holds the pull request again. The merge commit's first parent is the base branch,
  # whose copy of the gate's code, run on the Node and modules the base names, judges the pull
  # request's files, so a change to the gate's code can't let the pull request's own red change
  # through; a change to this job or the phone job is the review's to weigh. The diff shows every
  # file's text, whatever .gitattributes says of it. It holds the change on the phone job's status
  # rather than by failing (worker/phone-status.mjs).
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      # A pull request's timeline is an issue's, which the issues scope reads.
      issues: read
      checks: read
    outputs:
      held: ${{ steps.hold.outputs.held }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check out the base's gate
        run: git worktree add "$RUNNER_TEMP/base" HEAD^1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ${{ runner.temp }}/base/.nvmrc
      # The gate parses a page's scripts and stylesheets with esbuild, to tell what a change does
      # from how it's written. Its modules' cache is keyed on the base's lockfile alone, since the
      # checks job's cache, under the pull request's lockfile, is one its own code could write.
      - name: Name the base's modules
        id: base-modules-key
        run: echo "key=gate-modules-${{ runner.os }}-$(git rev-parse HEAD^1:package-lock.json)" >> "$GITHUB_OUTPUT"
      - id: base-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/base/node_modules
          key: ${{ steps.base-modules-key.outputs.key }}
      # No module the base installs runs a script of its own.
      - name: Install the base's modules
        if: steps.base-modules.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/base
        run: npm ci --ignore-scripts
      - name: Hold a red change for the owner's phone
        id: hold
        shell: bash
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --text --no-textconv --no-ext-diff --no-renames HEAD^1 HEAD | node "$RUNNER_TEMP/base/worker/red-change.mjs" "$LABELS"

  # The status a held red change waits on, pending until phone-ok, which main's rules require. It
  # runs none of the pull request's code, since its token can set the status.
  phone:
    needs: gate
    if: ${{ !cancelled() && needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Show on the head whether the owner's phone still has to try it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STATE: ${{ needs.gate.outputs.held == 'true' && 'pending' || 'success' }}
          DESCRIPTION: ${{ needs.gate.outputs.held == 'true' && 'A red change, waiting for phone-ok from beta' || 'Nothing left for the phone' }}
        run: gh api --method POST "repos/$REPO/statuses/$HEAD_SHA" -f context=phone -f state="$STATE" -f description="$DESCRIPTION"

  # The quick checks share one machine, which leaves more of the account's runners for the browser
  # tests.
  checks:
    needs: passed
    if: ${{ !cancelled() && !needs.passed.outputs.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - *setup-node
      - &restore-modules
        id: modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: &modules-key node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - &install-modules
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      # Each check runs even when one before it failed, so one run reports them all.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint
      - name: Check formatting
        if: ${{ !cancelled() }}
        run: npm run format:check
      - name: Check types
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: Find dead code
        if: ${{ !cancelled() }}
        run: npm run deadcode
      # The dot reporter prints each failure in full at the end of the run, where a reader of the
      # log's last lines finds it, while TAP's five lines a test put it thousands of lines back.
      - name: Test
        if: ${{ !cancelled() }}
        env: &test-reporter
          NODE_OPTIONS: --test-reporter=dot
        run: npm test
      # The runner is on UTC, ahead of MLB's Eastern day; this zone is behind it.
      - name: Test in another time zone
        if: ${{ !cancelled() }}
        env: *test-reporter
        run: TZ=Pacific/Honolulu npm test
      # A pull request's title sets the next version once it's squash merged (worker/release.mjs).
      # The title comes from GitHub rather than the event, so a re-run checks an edited title. The
      # files come from git, which lists a change of any size, where GitHub's diff stops at 20,000
      # lines; the merge commit's first parent is the base branch. Naming the shell adds pipefail,
      # so a failed diff can't pass as no changes.
      - name: Check the title
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: git diff --name-only --no-renames HEAD^1 HEAD | node worker/check-pr-title.mjs "$(gh pr view "$PR" --json title --jq .title)"

  # Which apps' browser tests the change reaches (worker/browser-scope.mjs), and which browser specs
  # burn-in repeats (worker/burn-in-specs.mjs). The merge commit's first parent is the base branch.
  scope:
    needs: passed
    if: ${{ !cancelled() && !needs.passed.outputs.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
      specs: ${{ steps.specs.outputs.specs }}
    steps:
      # The whole history, to read what changed since the last head that passed burn-in.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - *setup-node
      # Naming the shell adds pipefail, so a failed diff fails the job rather than reading as no
      # change.
      - id: apps
        shell: bash
        run: git diff --name-only --no-renames HEAD^1 HEAD | node worker/browser-scope.mjs
      - id: specs
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node worker/burn-in-specs.mjs

  # The browser tests take most of CI's time, so they run split across machines, for the apps the
  # change reaches.
  browser:
    needs: [passed, scope]
    if: ${{ !cancelled() && !needs.passed.outputs.run && needs.scope.outputs.apps != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - *setup-node
      - *restore-modules
      - *install-modules
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: &browsers-key playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # The tests run on Chromium's headless shell, so the full browser isn't needed, and GitHub's
      # Ubuntu runners already have the system libraries it needs. Without WebKit installed, the
      # config leaves out the WebKit projects, which run in the webkit job.
      - &install-browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      # A failed try's trace leaves out the page at each step, a sixth of every test's time, which
      # burn-in and the nightly run keep.
      - shell: bash
        env:
          TRACE_SNAPSHOTS: "off"
          APPS: ${{ needs.scope.outputs.apps }}
        run: |
          projects=()
          for app in $APPS; do projects+=(--project "$app"); done
          npm run test:browser -- --shard=${{ matrix.shard }}/${{ strategy.job-total }} "${projects[@]}"
      - &find-flaky
        id: flaky
        if: ${{ !cancelled() && hashFiles('test-results/report.json') != '' }}
        run: echo "found=$(node -p 'require("./test-results/report.json").stats.flaky > 0')" >> "$GITHUB_OUTPUT"
      # A test that passed only on its retry keeps its failed try's trace, and the next nightly run
      # names it in the issue Flaky browser tests (worker/report-flaky-tests.mjs).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure() || steps.flaky.outputs.found == 'true'
        with:
          name: browser-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/

  # A browser spec a pull request adds or changes runs ten times over, with no retry, so a test
  # that passes only some of the time fails on the pull request that brings it, rather than on
  # later ones. Only a test the pull request wrote or edited fails it: any other that failed goes
  # to the issue Flaky browser tests from the next nightly run (worker/judge-burn-in.mjs). Ten
  # runs of every spec a large pull request changes take longer than one machine's limit, so
  # they're split across machines too, and a machine whose share holds no test passes. When an
  # at-rest spec is among them, it installs WebKit too, as the webkit job does, so they repeat in
  # WebKit, where they've failed most.
  burn-in:
    needs: scope
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.specs != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - *setup-node
      - *restore-modules
      - *install-modules
      # Only restored, never saved, since a cache saved with WebKit in it would have the browser
      # job, whose machines lack WebKit's system libraries, run the WebKit projects.
      - id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: *browsers-key
      - *install-browsers
      - if: contains(needs.scope.outputs.specs, 'at-rest.spec.mjs')
        run: npx playwright install --with-deps webkit
      # Every test runs all ten times, however many fail, and the next step decides which
      # failures fail the pull request, so a failed test doesn't fail this one.
      - name: Repeat each browser spec this pull request changes
        shell: bash
        env:
          SPECS: ${{ needs.scope.outputs.specs }}
        run: |
          read -ra specs <<< "$SPECS"
          npm run test:browser -- --repeat-each=10 --retries=0 --max-failures=0 --pass-with-no-tests \
            --shard=${{ matrix.shard }}/${{ strategy.job-total }} "${specs[@]}" || true
      - name: Fail only on a test this pull request wrote or edited
        shell: bash
        run: git diff -U0 --no-renames HEAD^1 HEAD -- 'apps/*/tests/browser/*.spec.mjs' | node worker/judge-burn-in.mjs test-results/report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() && hashFiles('test-results/burn-in-flaky.json') != '' }}
        with:
          name: burn-in-flaky-${{ matrix.shard }}
          path: test-results/burn-in-flaky.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report-burn-in-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/

  # iPhones run the pages in WebKit, which runs only the at-rest specs, so one machine runs it. The
  # installed Playwright installs the WebKit it runs, with the system libraries GitHub's runners
  # lack, so the browser always matches the lockfile (tests/ci-workflow.test.js).
  webkit:
    needs: [passed, scope]
    if: ${{ !cancelled() && !needs.passed.outputs.run && needs.scope.outputs.apps != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - *setup-node
      - *restore-modules
      - *install-modules
      - run: npx playwright install --with-deps webkit
      - shell: bash
        env:
          APPS: ${{ needs.scope.outputs.apps }}
        run: |
          projects=()
          for app in $APPS; do projects+=(--project "$app-webkit"); done
          npm run test:browser -- "${projects[@]}"
      - *find-flaky
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure() || steps.flaky.outputs.found == 'true'
        with:
          name: browser-report-webkit
          path: |
            playwright-report/
            test-results/

  # A pull request can restore only the caches its own branch or main saved, so main saves any that
  # are missing, even when its checks are skipped. A failure here only costs pull requests their
  # cache, so it doesn't fail main's CI.
  caches:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - *setup-node
      - id: modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: *modules-key
          lookup-only: true
      - id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: *browsers-key
          lookup-only: true
      # Installing the browser takes the installed Playwright.
      - if: steps.modules.outputs.cache-hit != 'true' || steps.browsers.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: *modules-key
      - *install-browsers
      - if: steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: *browsers-key

  # Each pull request is reviewed in areas, by what its files are about, each test with its code
  # (worker/plan-review.mjs). In each area a reviewer for each kind of problem in KINDS reads every
  # line, listing each problem of its kind once with every place it shows, and then a checker
  # confirms each against the code; a check across areas names repeats and looks for what spans
  # them; and one step with no Claude posts what the checkers confirmed or left unsure, less the
  # repeats the check across areas named and with what it added (worker/post-review.mjs), so no
  # reviewer or checker can write to the pull request. The first review reads the whole change. A
  # review after it reads what the pushes since the last full read changed, and the whole change
  # is read once more alongside it, by FINAL_KIND's reviewer, whose findings are posted only when
  # the push's review finishes and posts nothing. A run on the head the last full read ended on
  # reads nothing and leaves that read's summary as it is.
  # Review passes only once everything due was read and checked (worker/judge-review.mjs). With
  # nothing to review, such as a push to main, it plans nothing and passes, since check fails on a
  # skipped job. A label change brings no new code, so it reviews again only when no run passed
  # every test and the review on exactly this code.
  review-plan:
    needs: passed
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      stage: ${{ steps.plan.outputs.stage }}
      areas: ${{ steps.plan.outputs.areas }}
      area-count: ${{ steps.plan.outputs.area-count }}
      kinds: ${{ steps.plan.outputs.kinds }}
      count: ${{ steps.plan.outputs.count }}
      final-areas: ${{ steps.plan.outputs.final-areas }}
      final-area-count: ${{ steps.plan.outputs.final-area-count }}
      final-kinds: ${{ steps.plan.outputs.final-kinds }}
      final-count: ${{ steps.plan.outputs.final-count }}
    steps:
      - name: Decide whether to review
        id: decision
        env:
          EVENT: ${{ github.event_name }}
          PASSED_RUN: ${{ needs.passed.outputs.run }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          reason=""
          if [ "$EVENT" != "pull_request" ]; then
            reason="only pull requests are reviewed"
          elif [ -n "$PASSED_RUN" ]; then
            reason="a run on exactly this code already passed its review"
          elif [ "$IS_DRAFT" = "true" ]; then
            reason="a draft is reviewed once it's ready for review"
          elif [ "$AUTHOR" = "dependabot[bot]" ]; then
            reason="Dependabot's pull requests aren't reviewed"
          elif [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            reason="there's no CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret"
          fi
          if [ -n "$reason" ]; then
            echo "::notice::Nothing was reviewed: $reason."
            echo "review=false" >> "$GITHUB_OUTPUT"
          else
            echo "review=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.decision.outputs.review == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The whole history, to read since the last review's head and to look back as reviewers
          # do.
          fetch-depth: 0
          # Claude reads the checkout, and the review needs no git credentials on disk.
          persist-credentials: false
      - if: steps.decision.outputs.review == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      # The review guide comes from the default branch, so a pull request can't change what its
      # reviewers look for.
      - name: Split the change into areas, and write what the reviewers read
        id: plan
        if: steps.decision.outputs.review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          DESCRIPTION: ${{ github.event.pull_request.body }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node worker/plan-review.mjs .review >> "$GITHUB_OUTPUT"
          node worker/review-context.mjs .review
          git show "origin/$DEFAULT_BRANCH:REVIEW.md" > .review/REVIEW.md
      - if: steps.decision.outputs.review == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: review-plan
          path: .review/
          include-hidden-files: true
          retention-days: 14
          overwrite: true

  # Each area's reviewers and then its checker, as one unit that waits for no other area
  # (review-area.yml).
  review-area:
    name: review-area (${{ matrix.name }})
    needs: review-plan
    if: ${{ !cancelled() && needs.review-plan.outputs.count > 0 }}
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.review-plan.outputs.areas || '[]') }}
    uses: ./.github/workflows/review-area.yml
    with:
      stage: ${{ needs.review-plan.outputs.stage }}
      area: ${{ matrix.area }}
      name: ${{ matrix.name }}
      kinds: ${{ needs.review-plan.outputs.kinds }}
    secrets: &review-secrets
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  # What no one area can see: a change one area's files rely on in another's, the same fix due in
  # the other app, and one fact or rule now in two places. It names only the repeats to merge, with
  # the words that name each place they show, and what it adds, so no finding a checker kept drops
  # out of its answer, and leaves its answer for the posting step. A change of one area needs none.
  review-across:
    needs: [review-plan, review-area]
    if: ${{ !cancelled() && needs.review-area.result != 'skipped' && needs.review-plan.outputs.area-count > 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      STAGE: ${{ needs.review-plan.outputs.stage }}
      AREAS: ${{ needs.review-plan.outputs.area-count }}
    steps: &across-steps
      - &review-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - *setup-node
      - &download-plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-plan
          path: .review/
      - &download-checks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: review-check-${{ env.STAGE }}-*
          path: .review/
          merge-multiple: true
      - name: List the checkers' findings
        run: node worker/post-review.mjs list .review "$STAGE"
      - name: Check across the areas
        id: across
        continue-on-error: true
        timeout-minutes: 20
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          show_full_output: true
          settings: '{"disableAllHooks": true}'
          claude_args: |
            --model claude-opus-5-5
            --max-turns 150
            --allowedTools "Read,Grep,Glob,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git blame:*)"
            --json-schema '{"type":"object","properties":{"duplicates":{"type":"array","items":{"type":"object","properties":{"refs":{"type":"array","items":{"type":"string"}},"body":{"type":"string"}},"required":["refs","body"]}},"added":{"type":"array","items":{"type":"object","properties":{"weight":{"type":"string","enum":["Important","Nit","Pre-existing","Unsure"]},"path":{"type":"string"},"line":{"type":"integer"},"body":{"type":"string"}},"required":["weight","path","line","body"]}},"unjudged":{"type":"array","items":{"type":"object","properties":{"file":{"type":"string"},"why":{"type":"string"}},"required":["file","why"]}}},"required":["duplicates","added","unjudged"]}'
          prompt: |
            You make the last check of pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}'s review before its findings are posted. Its change is split into ${{ env.AREAS }} areas, and each area's checker checked what its reviewers found. Every finding they confirmed or left unsure is in `.review/checked-${{ env.STAGE }}.json`, each with a ref, and all of them are posted unless you name them as repeats.

            1. Read `.review/REVIEW.md`, the review guide as the default branch has it. AGENTS.md holds the rules the code keeps.
            2. Read `.review/pull-request.md`, with the pull request's description and every review thread on it, `.review/${{ env.STAGE }}.md`, which lists each area's diff files, and `.review/checked-${{ env.STAGE }}.json`.
            3. Name each group of findings that are the same problem, in different areas or in different places, by their refs, the one on its first place first, with the body that one is posted with: what is wrong, when it goes wrong, and how to fix it, naming every place the group's findings name. Only the first of each group is posted, on its line, at the heaviest weight a checker settled in its group.
            4. Look for what no one area could see: a change in one area that another area's files rely on, the same fix due in the other app or another view, one fact or rule now in two places across areas, and docs or comments a change makes wrong. Check each against the code as a checker does, with Read, Grep, Glob, git log, git show, git diff, and git blame, each command on its own, with no pipes or redirects. Add each you confirm that no listed finding already says, one for each problem, naming every place it shows, on the line the diff changes nearest its first place, weighed as the guide says, its body saying what is wrong, when it goes wrong, and how to fix it, without its weight.
            5. Post nothing. End with your answer: the groups of repeats, the findings you add, and anything you couldn't judge from the code, and why.
      - name: Keep the check's answer
        if: steps.across.outcome == 'success'
        env:
          STRUCTURED_OUTPUT: ${{ steps.across.outputs.structured_output }}
        run: node worker/post-review.mjs across .review "$STAGE"
      - if: steps.across.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: review-across-${{ env.STAGE }}
          path: .review/across-${{ env.STAGE }}.json
          retention-days: 14
          overwrite: true
      # So that re-running the failed jobs checks across the areas again.
      - name: Fail when the check across areas didn't finish
        if: steps.across.outcome != 'success'
        run: |
          echo "::error::The check across areas didn't finish."
          exit 1

  # Posts what the checkers confirmed or left unsure, less the repeats the check across areas named
  # and with what it added (worker/post-review.mjs). It and its final twin are the only review jobs
  # but the summary that can write to the pull request, and run no Claude.
  review-post:
    needs: [review-plan, review-area, review-across]
    if: ${{ !cancelled() && needs.review-plan.outputs.count > 0 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    outputs:
      posted: ${{ steps.post.outputs.posted }}
    env:
      STAGE: ${{ needs.review-plan.outputs.stage }}
      AREAS: ${{ needs.review-plan.outputs.area-count }}
    steps: &post-steps
      - *review-checkout
      - *setup-node
      - *download-plan
      - *download-checks
      - if: env.AREAS > 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-across-${{ env.STAGE }}
          path: .review/
      - name: Post the findings
        id: post
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: node worker/post-review.mjs post .review "$STAGE" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: review-post-${{ env.STAGE }}
          path: .review/post-${{ env.STAGE }}.json
          retention-days: 14
          overwrite: true

  # A push's review reads the whole change once more alongside, by FINAL_KIND's reviewer in each
  # area, to find what the earlier reads missed. Only when the push's review finishes and posts
  # nothing, and every area of this read finished, are its findings checked across areas and
  # posted, and the summary says what it found. check doesn't need it, since it fails when an area
  # does, even one whose read wasn't due; review judges whether it was.
  review-final-area:
    name: review-final-area (${{ matrix.name }})
    needs: review-plan
    if: ${{ !cancelled() && needs.review-plan.outputs.final-count > 0 }}
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.review-plan.outputs.final-areas || '[]') }}
    uses: ./.github/workflows/review-area.yml
    with:
      stage: final
      area: ${{ matrix.area }}
      name: ${{ matrix.name }}
      kinds: ${{ needs.review-plan.outputs.final-kinds }}
    secrets: *review-secrets

  review-final-across:
    needs: [review-plan, review-area, review-post, review-final-area]
    if: ${{ !cancelled() && needs.review-final-area.result == 'success' && needs.review-plan.outputs.final-area-count > 1 && needs.review-area.result == 'success' && needs.review-post.outputs.posted == '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      STAGE: final
      AREAS: ${{ needs.review-plan.outputs.final-area-count }}
    steps: *across-steps

  review-final-post:
    needs: [review-plan, review-area, review-post, review-final-area, review-final-across]
    if: ${{ !cancelled() && needs.review-final-area.result == 'success' && needs.review-area.result == 'success' && needs.review-post.outputs.posted == '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      STAGE: final
      AREAS: ${{ needs.review-plan.outputs.final-area-count }}
    steps: *post-steps

  # Fails a review that left anything due unread or unchecked, naming it in the one summary comment
  # it keeps up to date on the pull request. A run a newer push cancelled leaves the summary to the
  # newer push's run.
  review:
    needs:
      [
        review-plan,
        review-area,
        review-across,
        review-post,
        review-final-area,
        review-final-across,
        review-final-post,
      ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Fail when the review couldn't be planned
        if: needs.review-plan.result != 'success'
        run: |
          echo "::error::The review's plan didn't finish, so nothing was reviewed."
          exit 1
      - if: needs.review-plan.outputs.count != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: needs.review-plan.outputs.count != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - if: needs.review-plan.outputs.count != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: review-*
          path: .review/
          merge-multiple: true
      - name: Post the summary, and fail if anything due went unread or unchecked
        if: needs.review-plan.outputs.count != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: node worker/judge-review.mjs summary .review

  # The one check to require. It runs even when a job fails, because GitHub counts a
  # skipped required check as passing.
  check:
    if: always()
    needs:
      [
        passed,
        gate,
        phone,
        checks,
        scope,
        browser,
        burn-in,
        webkit,
        review-plan,
        review-area,
        review-across,
        review-post,
        review-final-across,
        review-final-post,
        review,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Every test passed when passed found a run that passed them on exactly this code, or when
      # every job but the gate passed, the browser tests only where the change reaches them.
      - name: Tell whether every test passed
        id: tested
        env:
          TESTED: >-
            ${{ needs.passed.outputs.run != '' || (needs.checks.result == 'success' &&
            needs.scope.result == 'success' && needs.review.result == 'success' &&
            (needs.scope.outputs.apps == '' || (needs.browser.result == 'success' &&
            needs.webkit.result == 'success')) &&
            (needs.scope.outputs.specs == '' || needs.burn-in.result == 'success')) }}
          # A draft's run passes without its review, which comes once it's ready on the same code, so
          # it doesn't stand in for one. Any other run skips a review that would never run.
          REVIEWED: >-
            ${{ needs.passed.outputs.run != '' || needs.review-plan.outputs.count != '' ||
            !github.event.pull_request.draft }}
        run: |
          echo "tested=$TESTED" >> "$GITHUB_OUTPUT"
          echo "reviewed=$REVIEWED" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - if: needs.gate.outputs.held == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Tell whether main's rules hold a red change on the phone status
        id: phone
        if: needs.gate.outputs.held == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node worker/phone-status.mjs
      # Records the code this pull request's checks passed on: once every test and the review passed,
      # so a label change runs only the gate again, and once the gate let it through too, so that once
      # it merges, main deploys at once if it has exactly that code (worker/find-passed-ci.mjs).
      - name: Record the code the checks ran on
        id: code
        if: github.event_name == 'pull_request'
        run: |
          git rev-parse HEAD > passed-commit.txt
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: >-
          github.event_name == 'pull_request' && steps.tested.outputs.tested == 'true' &&
          steps.tested.outputs.reviewed == 'true'
        with:
          name: ci-tested-${{ steps.code.outputs.tree }}
          path: passed-commit.txt
          retention-days: 14
      - name: Require every job to pass
        if: >-
          steps.tested.outputs.tested != 'true' ||
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
          (github.event_name == 'pull_request' && needs.gate.result != 'success') ||
          (needs.gate.outputs.held == 'true' && steps.phone.outputs.required != 'true')
        run: exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'pull_request' && needs.gate.outputs.held != 'true'
        with:
          name: ci-passed-${{ steps.code.outputs.tree }}
          path: passed-commit.txt
          retention-days: 14
