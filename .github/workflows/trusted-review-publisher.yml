name: Reconcile trusted review

on:
  workflow_dispatch:
  pull_request:
    branches: [issue-809-proof-base]
    types: [opened]
  workflow_run:
    workflows: [Trusted review]
    types: [requested, in_progress, completed]
  pull_request_target:
    types:
      [
        opened,
        reopened,
        synchronize,
        edited,
        converted_to_draft,
        ready_for_review,
        closed,
        labeled,
        unlabeled,
      ]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  access-canary:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: trusted-review-publisher
    steps:
      - name: Check environment access
        shell: bash
        env:
          CANARY_PRESENT: ${{ secrets.TRUSTED_REVIEW_SETUP_CANARY != '' }}
        run: |
          set -euo pipefail
          printf 'event=%s ref=%s sha=%s workflow=%s run=%s attempt=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA" "$GITHUB_WORKFLOW_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          if [ "$GITHUB_REF" != 'refs/heads/main' ] || [ "$GITHUB_WORKFLOW_REF" != 'kaplanoah/sports-apps/.github/workflows/trusted-review-publisher.yml@refs/heads/main' ]; then
            echo '::error::A disallowed ref reached a runner; environment isolation failed.'
            exit 1
          fi
          if [ "$CANARY_PRESENT" != 'true' ]; then
            echo '::error::The environment-only canary is unavailable.'
            exit 1
          fi
          echo 'Main received the harmless environment canary; no secret value was logged.'

  discover:
    if: vars.TRUSTED_REVIEW_PUBLISHER_ENABLED == 'true' && (github.event_name == 'pull_request_target' || github.event_name == 'workflow_run')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heads: ${{ steps.heads.outputs.heads }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Discover affected commit checks
        id: heads
        env:
          GH_TOKEN: ${{ github.token }}
        run: node worker/publish-trusted-review.mjs discover

  reconcile:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        head: ${{ fromJSON(needs.discover.outputs.heads) }}
    uses: ./.github/workflows/publish-trusted-review.yml
    with:
      head: ${{ matrix.head }}
      phase: observe
