name: Review an area

# One area of CI's review, which ci.yml's review jobs call for each area of a stage: a reviewer for
# each kind of problem reads the area's diffs, and then its checker confirms what they found, so an
# area's checker waits only for its own reviewers, never for another area's.
on:
  workflow_call:
    inputs:
      stage:
        type: string
        required: true
      area:
        type: number
        required: true
      name:
        type: string
        required: true
      # The kinds of reviewer the area has, as plan-review.mjs lists them.
      kinds:
        type: string
        required: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false

permissions:
  contents: read

env:
  STAGE: ${{ inputs.stage }}
  AREA: ${{ inputs.area }}

jobs:
  # A reviewer is told to read every line of its area's diffs and rule files, which a step then
  # checks from the reads it actually made, and a second try reads what the first left unread, or
  # judges the whole area again when the first gave no answer. The token is the run's own rather
  # than Claude's app's, which works only while this file is as the default branch has it, so a
  # change to the review is reviewed by its own jobs, and the guide has them flag one that lets
  # less through.
  find:
    name: find (${{ matrix.kind }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.kinds) }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - &setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - &download-plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-plan
          path: .review/
      - name: Review
        id: review
        continue-on-error: true
        timeout-minutes: 15
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: &oauth-token ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: &api-key ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: &run-token ${{ github.token }}
          show_full_output: true
          settings: &review-settings '{"disableAllHooks": true}'
          claude_args: &find-args |
            --model claude-opus-5-5
            --max-turns 150
            --allowedTools "Read,Grep,Glob,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git blame:*)"
            --json-schema '{"type":"object","properties":{"candidates":{"type":"array","items":{"type":"object","properties":{"path":{"type":"string"},"line":{"type":"integer"},"weight":{"type":"string","enum":["Important","Nit","Pre-existing"]},"confidence":{"type":"string","enum":["high","medium","low"]},"claim":{"type":"string"},"when":{"type":"string"},"fix":{"type":"string"}},"required":["path","line","weight","confidence","claim","when","fix"]}},"unjudged":{"type":"array","items":{"type":"object","properties":{"file":{"type":"string"},"why":{"type":"string"}},"required":["file","why"]}}},"required":["candidates","unjudged"]}'
          prompt: |
            You are a reviewer of pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}. Its change is split into areas by what the files are about, and each area's reviewers each look for one kind of problem. You review area ${{ inputs.area }}, "${{ inputs.name }}", and look only for this: ${{ matrix.focus }}

            1. Read `.review/REVIEW.md`, the review guide as the default branch has it, and follow it. AGENTS.md and the rule files your area lists hold the rules the code keeps.
            2. Read `.review/pull-request.md`: the pull request's title and description, and every review thread on it so far, with its replies and whether it's resolved.
            3. Read `.review/${{ env.STAGE }}.md`, which lists each area's files, the diff files that hold their change, and the rule files for them. Read every diff file and rule file listed under Area ${{ inputs.area }}, each whole, with Read and no offset or limit, or, should Read say one is too big, in pieces with offset and limit that cover all of it. A step after you checks your reads, and the review fails on any line of your area's diffs or rule files you didn't read.
            4. Read what else you need to judge them: the files as the pull request leaves them, other areas' diffs, callers, and copies, with Read, Grep, and Glob, and history with git log, git show, git diff, and git blame, whose base is HEAD^1 and whose whole history is here. Run each command on its own, with no pipes or redirects.
            5. List every problem of your kind you find, not a sample, each once, naming every place it shows, in both apps too. Include one you're unsure of, with your confidence: a checker confirms each against the code before anything is posted. Leave out one a thread already raised, unless its reply is wrong or a fix it claims didn't hold, and then say so.
            6. Post nothing. End with your answer: each problem, on the line the diff changes nearest its first place, naming that place if it's another; and each file of your area you read but couldn't judge from the code, and why.
      - name: Find what the review left unread
        id: first
        if: ${{ !cancelled() }}
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          STRUCTURED_OUTPUT: ${{ steps.review.outputs.structured_output }}
          KIND: ${{ matrix.kind }}
        run: node worker/judge-review.mjs find .review "$STAGE" "$AREA" "$KIND" >> "$GITHUB_OUTPUT"
      - name: Review what's left
        id: again
        if: &retry-due ${{ !cancelled() && steps.first.outcome == 'success' && (steps.first.outputs.unread != '' || steps.first.outputs.answered != 'true') }}
        continue-on-error: true
        timeout-minutes: 15
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: *oauth-token
          anthropic_api_key: *api-key
          github_token: *run-token
          show_full_output: true
          settings: *review-settings
          claude_args: *find-args
          prompt: |
            You are a reviewer of pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}. You review area ${{ inputs.area }}, "${{ inputs.name }}", and look only for this: ${{ matrix.focus }} An earlier try didn't finish. Files it left unread: ${{ steps.first.outputs.unread || 'none' }}. ${{ steps.first.outputs.answered == 'true' && 'Its answer is kept, so judge only what those files change.' || 'It gave no answer, so judge your whole area again.' }}

            1. Read `.review/REVIEW.md`, the review guide as the default branch has it, and follow it. AGENTS.md and the rule files your area lists hold the rules the code keeps. `.review/pull-request.md` holds the pull request's description and every review thread on it.
            2. Read each file the earlier try left unread, under `.review/`, whole, with Read and no offset or limit, or, should Read say one is too big, in pieces with offset and limit that cover all of it. A step after you checks your reads, and the review fails on any line of them you didn't read. A rule file changes nothing itself, so judge your area's whole diff against each rule file the earlier try left unread. `.review/${{ env.STAGE }}.md` lists your area's diff files and rule files, to read as you need.
            3. Read what else you need, with Read, Grep, Glob, git log, git show, git diff, and git blame, whose base is HEAD^1. Run each command on its own, with no pipes or redirects.
            4. List every problem of your kind you find in what you judge, each once, naming every place it shows, unsure ones too, with your confidence. Leave out one a thread already raised, unless its reply is wrong or a fix it claims didn't hold.
            5. Post nothing. End with your answer: each problem, on the line the diff changes nearest its first place, and each file you read but couldn't judge from the code, and why.
      - name: Find what's still unread
        id: last
        if: *retry-due
        env:
          EXECUTION_FILE: ${{ steps.again.outputs.execution_file }}
          STRUCTURED_OUTPUT: ${{ steps.again.outputs.structured_output }}
          KIND: ${{ matrix.kind }}
        run: node worker/judge-review.mjs find .review "$STAGE" "$AREA" "$KIND" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: review-find-${{ env.STAGE }}-${{ env.AREA }}-${{ matrix.kind }}
          path: .review/find-${{ env.STAGE }}-${{ env.AREA }}-${{ matrix.kind }}.json
          retention-days: 14
          # A re-run of the job uploads its record again.
          overwrite: true
      # So that re-running the failed jobs reviews this area again.
      - name: Fail when parts are still unread or the reviewer gave no answer
        if: ${{ !cancelled() && (steps.last.outputs.unread != '' || steps.last.outputs.answered == 'false') }}
        run: |
          echo "::error::This reviewer didn't read every line of its area's diffs and rule files, or gave no answer."
          exit 1

  # The area's checker confirms its reviewers' problems against the code, merges repeats, and weighs
  # each, before anything is posted.
  check:
    needs: find
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - *checkout
      - *setup-node
      - *download-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: review-find-${{ env.STAGE }}-${{ env.AREA }}-*
          path: .review/
          merge-multiple: true
      - name: Gather the area's candidates
        id: gather
        run: node worker/judge-review.mjs candidates .review "$STAGE" "$AREA" >> "$GITHUB_OUTPUT"
      # An area whose reviewers found nothing has nothing to check.
      - name: Check the candidates
        id: check
        if: steps.gather.outputs.count != '0'
        continue-on-error: true
        timeout-minutes: 20
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: *oauth-token
          anthropic_api_key: *api-key
          github_token: *run-token
          show_full_output: true
          settings: *review-settings
          claude_args: |
            --model claude-opus-5-5
            --max-turns 150
            --allowedTools "Read,Grep,Glob,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git blame:*)"
            --json-schema '{"type":"object","properties":{"findings":{"type":"array","items":{"type":"object","properties":{"ids":{"type":"array","items":{"type":"string"}},"verdict":{"type":"string","enum":["confirmed","rejected","unsure"]},"weight":{"type":"string","enum":["Important","Nit","Pre-existing"]},"path":{"type":"string"},"line":{"type":"integer"},"body":{"type":"string"},"why":{"type":"string"}},"required":["ids","verdict","weight","path","line","body","why"]}},"unjudged":{"type":"array","items":{"type":"object","properties":{"file":{"type":"string"},"why":{"type":"string"}},"required":["file","why"]}}},"required":["findings","unjudged"]}'
          prompt: |
            You check what the reviewers of one area of pull request #${{ github.event.pull_request.number }} in ${{ github.repository }} found, before anything is posted. Your area is ${{ inputs.area }}, "${{ inputs.name }}". Its reviewers each looked for one kind of problem and listed every problem of it, unsure ones included. Their candidates are in `.review/candidates-${{ env.STAGE }}-${{ env.AREA }}.json`.

            1. Read `.review/REVIEW.md`, the review guide as the default branch has it. AGENTS.md and the rule files `.review/${{ env.STAGE }}.md` lists for your area hold the rules the code keeps.
            2. Read `.review/pull-request.md`, with the pull request's description and every review thread on it so far, and `.review/${{ env.STAGE }}.md`, which lists your area's diff files and rule files, and read those as you need.
            3. Check each candidate's claim against the code: read the lines it names, trace the path from a real caller or input to what goes wrong, and see what the base did with git show HEAD^1:<path>. Use Read, Grep, Glob, git log, git show, git diff, and git blame, each command on its own, with no pipes or redirects.
            4. Give each a verdict. Confirmed: the code does what it says, and it matters as the guide weighs it. Rejected: the claim is wrong, the path can't happen, a thread already raised it and its answer holds, or it's a matter of taste. The guide's numbered items are never taste: a rule now in two places, a leftover, or a doc the change makes wrong is a finding whenever the code shows it. Unsure: it would matter and you can't settle it; say what would.
            5. Merge candidates that are the same problem into one finding, whether they name one place or several, naming every id it merges: one problem is one finding, however many places it shows, in both apps too. Every candidate's id appears in exactly one finding, rejected ones too: a step after you checks.
            6. Weigh each as the guide says: Important for a bug, meaning a wrong result someone can see, wrong data kept, or a failure, and for a security hole or a broken rule from AGENTS.md or a rule file; Nit for something worth fixing that doesn't block; Pre-existing for a problem in code the change didn't make worse.
            7. Write each finding's body as the guide's "How to report" says: what is wrong, when it goes wrong, and how to fix it, in a few sentences, without its weight, which a later step adds, naming every place it shows. Put it on the line the diff changes nearest its first place, naming that place if it's another.
            8. Post nothing. End with your answer: every finding, rejected ones too, and anything you couldn't judge from the code, and why.
      - name: Keep the checker's answer
        id: keep
        if: steps.check.outcome == 'success' || steps.gather.outputs.count == '0'
        env:
          STRUCTURED_OUTPUT: ${{ steps.check.outputs.structured_output }}
        run: node worker/judge-review.mjs check .review "$STAGE" "$AREA" >> "$GITHUB_OUTPUT"
      - if: steps.keep.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: review-check-${{ env.STAGE }}-${{ env.AREA }}
          path: |
            .review/check-${{ env.STAGE }}-${{ env.AREA }}.json
            .review/candidates-${{ env.STAGE }}-${{ env.AREA }}.json
          retention-days: 14
          overwrite: true
      # So that re-running the failed jobs checks this area again. A check that didn't finish keeps
      # no answer, whose unchecked GitHub would compare as 0, so it fails here on that alone.
      - name: Fail when the check didn't finish
        if: steps.keep.outcome != 'success' || steps.keep.outputs.unchecked != '0'
        run: |
          echo "::error::This area's checker didn't finish, or left problems unchecked."
          exit 1
