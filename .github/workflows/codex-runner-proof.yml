name: Prove Codex hosted runner

on:
  workflow_dispatch:
    inputs:
      evidence-certificate:
        description: Public evidence encryption certificate, never a private key or API credential
        type: string
        required: true

permissions:
  contents: read

env:
  TRUSTED_CODEX_REVIEW_ENABLED: ${{ vars.TRUSTED_CODEX_REVIEW_ENABLED }}

jobs:
  prepare:
    if: &proof-authority github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.run_attempt == 1 && vars.TRUSTED_CODEX_REVIEW_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      model-queue: ${{ steps.request.outputs.model-queue }}
      node-version: ${{ steps.node.outputs.node-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Prepare trusted controls and a disposable hostile project
        id: request
        env:
          CODEX_EVIDENCE_CERTIFICATE: ${{ inputs.evidence-certificate }}
        run: node worker/prove-codex-runner.mjs prepare
      - run: npm ci --ignore-scripts --no-audit
      - name: Package trusted native admission controls
        id: rate-input
        run: node worker/prepare-codex-rate.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-rate-input-proof
          path: ${{ steps.rate-input.outputs.rate-input }}
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codex-proof-input
          path: ${{ runner.temp }}/codex-proof-input.tgz
          retention-days: 1

  model:
    needs: prepare
    if: *proof-authority
    name: native-codex-proof
    concurrency:
      group: ${{ needs.prepare.outputs.model-queue }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ needs.prepare.outputs.node-version }}
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codex-proof-input
          path: ${{ runner.temp }}/codex-proof-download
      - name: Install only the proof fixture and trusted configuration
        run: tar -xzf "$RUNNER_TEMP/codex-proof-download/codex-proof-input.tgz" -C "$RUNNER_TEMP"
      - name: Prepare the answer destination
        run: mkdir "$RUNNER_TEMP/codex-answer"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-rate-input-proof
          path: ${{ runner.temp }}/native-rate-download
      - run: tar -xzf "$RUNNER_TEMP/native-rate-download/native-rate-input.tgz" -C "$RUNNER_TEMP"
      - name: Authenticate preceding quota state and prepare protected admission
        id: rate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/native-rate-input/runtime.mjs" prepare "$RUNNER_TEMP/native-rate-input"
      - name: Run one native Codex proof
        id: model
        continue-on-error: true
        uses: openai/codex-action@c05cfd74ad95c626cdf05c6685e62becc3bf7813
        env:
          BASH_ENV: ${{ steps.rate.outputs.hook }}
          TRIAL_SECRET_CANARY: harmless-shell-isolation-test
        with:
          openai-api-key: ${{ secrets.TRUSTED_REVIEW_OPENAI_API_KEY }}
          responses-api-endpoint: ${{ steps.rate.outputs.endpoint }}
          codex-version: 0.164.0
          model: gpt-6.1-sol
          effort: high
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          codex-home: ${{ runner.temp }}/codex-home
          working-directory: ${{ runner.temp }}/codex-proof/checkout
          prompt-file: ${{ runner.temp }}/codex-proof/prompt.txt
          output-schema-file: ${{ runner.temp }}/codex-proof/schema.json
          output-file: ${{ runner.temp }}/codex-answer/answer.json
          codex-args: '["--ephemeral", "--json"]'
      - name: Retain fixed native admission failure facts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.rate.outcome == 'failure'
        with:
          name: native-rate-setup-proof
          path: ${{ runner.temp }}/native-rate-setup.json
          retention-days: 14
          if-no-files-found: error
      - name: Require finalized native quota state and cleanup
        if: always() && steps.rate.outcome == 'success'
        env:
          RATE_COLLECTOR: ${{ steps.rate.outputs.collector }}
          RATE_FOLDER: ${{ steps.rate.outputs.folder }}
        run: node "$RATE_COLLECTOR" collect "$RATE_FOLDER"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.rate.outcome == 'success'
        with:
          name: ${{ steps.rate.outputs.artifact }}
          path: ${{ steps.rate.outputs.result }}
          if-no-files-found: error
          retention-days: 90
      # The model cannot see current source, historical fixes or evaluation rubrics.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: always()
        with:
          ref: ${{ github.sha }}
          path: controls
          persist-credentials: false
      - name: Verify actual tool evidence and retain only proof facts and numeric usage
        if: always()
        env:
          MODEL_OUTCOME: ${{ steps.model.outcome }}
        run: node controls/worker/prove-codex-runner.mjs collect
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: codex-runner-proof
          path: ${{ runner.temp }}/codex-proof-result/proof.json
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: codex-proof-private
          path: ${{ runner.temp }}/trial-private/evidence.cms
          retention-days: 14
          if-no-files-found: error
