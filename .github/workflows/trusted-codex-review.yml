name: Trusted Codex review

on:
  workflow_call:
    inputs:
      portion:
        type: string
        required: true
      selection:
        type: string
        required: true
      merge:
        type: string
        required: true
      base:
        type: string
        required: true
    secrets:
      TRUSTED_REVIEW_OPENAI_API_KEY:
        required: true

permissions:
  contents: read

env:
  REVIEW_PROVIDER: codex
  REVIEW_SELECTION: ${{ inputs.selection }}
  REVIEW_MERGE: ${{ inputs.merge }}
  REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
  REVIEW_BASE: ${{ inputs.base }}
  REVIEW_TRUSTED: ${{ github.sha }}
  PR: ${{ github.event.pull_request.number }}
  PORTION: ${{ inputs.portion }}

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - &node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - &source
        name: Preserve trusted controls
        run: |
          mkdir "$RUNNER_TEMP/trusted"
          git archive "$REVIEW_TRUSTED" | tar -x -C "$RUNNER_TEMP/trusted"
      - &prepare
        name: Prepare exact reviewed code
        run: node "$RUNNER_TEMP/trusted/worker/trusted-review.mjs" prepare
      - &plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: trusted-review-plan
          path: ${{ runner.temp }}/review-input/
      - &portions
        if: inputs.portion == 'integration'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: trusted-review-find-*
          path: ${{ runner.temp }}/review-input/
      - &import
        name: Validate trusted inputs
        run: node "$RUNNER_TEMP/trusted/worker/trusted-review.mjs" import "$RUNNER_TEMP/review-input"
      - &candidates
        name: Gather every candidate for integration
        if: inputs.portion == 'integration'
        run: node "$RUNNER_TEMP/trusted/worker/trusted-review.mjs" candidates
      - name: Supply complete context and a native output schema
        id: request
        run: node "$RUNNER_TEMP/trusted/worker/review-codex.mjs" request "$PORTION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trusted-codex-request-${{ inputs.portion }}
          path: ${{ steps.request.outputs.request }}/
          retention-days: 14
          overwrite: true

  model:
    needs: request
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    steps:
      - *checkout
      - *node
      - *source
      - *prepare
      - *plan
      - *portions
      - *import
      - *candidates
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trusted-codex-request-${{ inputs.portion }}
          path: ${{ runner.temp }}/codex-request/
      - name: Prepare trusted Codex configuration
        run: node "$RUNNER_TEMP/trusted/worker/review-codex.mjs" config
      - name: Prepare the answer destination
        run: mkdir "$RUNNER_TEMP/codex-answer"
      - name: Investigate with native Codex
        uses: openai/codex-action@c05cfd74ad95c626cdf05c6685e62becc3bf7813
        env:
          BASH_ENV: ${{ runner.temp }}/codex-log-capture.sh
        with:
          openai-api-key: ${{ secrets.TRUSTED_REVIEW_OPENAI_API_KEY }}
          codex-version: 0.164.0
          model: gpt-6.1-sol
          effort: high
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          codex-home: ${{ runner.temp }}/codex-home
          working-directory: ${{ github.workspace }}
          prompt-file: ${{ runner.temp }}/codex-request/prompt.txt
          output-schema-file: ${{ runner.temp }}/codex-request/schema.json
          output-file: ${{ runner.temp }}/codex-answer/answer.json
          codex-args: '["--ephemeral", "--json"]'
      - name: Retain only native usage counters
        if: always()
        run: node "$RUNNER_TEMP/trusted/worker/review-codex.mjs" usage
      # Validation and publishing use fresh hosts; raw transcripts never leave this runner.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: trusted-codex-answer-${{ inputs.portion }}
          path: |
            ${{ runner.temp }}/codex-answer/answer.json
            ${{ runner.temp }}/codex-answer/usage.jsonl
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  validate:
    needs: model
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - *checkout
      - *node
      - *source
      - *prepare
      - *plan
      - *portions
      - *import
      - *candidates
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trusted-codex-answer-${{ inputs.portion }}
          path: ${{ runner.temp }}/codex-answer/
      - name: Validate native results against the exact supplied request
        id: answer
        env:
          CODEX_ANSWER_FILE: ${{ runner.temp }}/codex-answer/answer.json
        run: node "$RUNNER_TEMP/trusted/worker/review-codex.mjs" accept "$PORTION"
      - name: Seal the complete portion
        if: inputs.portion != 'integration'
        run: node "$RUNNER_TEMP/trusted/worker/trusted-review.mjs" export "find-$PORTION"
      - if: inputs.portion != 'integration'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trusted-review-find-${{ inputs.portion }}
          path: ${{ env.REVIEW_UPLOAD }}/trusted-review-find-${{ inputs.portion }}/
          retention-days: 14
          overwrite: true
      - name: Seal the integrated verdict
        if: steps.answer.outputs.integrated == 'true'
        id: integrated
        run: node "$RUNNER_TEMP/trusted/worker/trusted-review.mjs" export across
      - if: steps.integrated.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trusted-review-across
          path: ${{ env.REVIEW_UPLOAD }}/trusted-review-across/
          retention-days: 14
          overwrite: true
