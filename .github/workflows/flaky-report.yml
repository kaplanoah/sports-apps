name: Report flaky tests

# Names each browser test a pull request's CI run passed only on its retry, or that its burn-in
# found failing in a test the pull request didn't write, in the issue Flaky browser tests
# (worker/report-flaky-tests.mjs). It runs once CI finishes, from the default branch's copy of this
# workflow and its code, so a pull request's own code never runs with the routine's token, and
# naming a flaky test never changes how CI's run ended.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  # Each report reads the issue's table and writes it back, so every report, the nightly run's too
  # (flaky.yml), takes its turn in one group, where a newer report replaces one still waiting. A
  # fork's run could hand it anything, so only this repository's branches report.
  report:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    concurrency:
      group: flaky-tests-issue
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        continue-on-error: true
        with:
          pattern: browser-report-*
          path: browser-reports/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        continue-on-error: true
        with:
          pattern: burn-in-flaky-*
          path: burn-in-flaky/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      # A test new to the issue starts the routine that fixes flaky tests, through its API trigger.
      - name: Name each test its retry passed, or burn-in found failing, in the issue Flaky browser tests
        if: ${{ hashFiles('browser-reports/**/report.json') != '' || hashFiles('burn-in-flaky/**/burn-in-flaky.json') != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          FLAKY_ROUTINE_URL: ${{ secrets.FLAKY_ROUTINE_URL }}
          FLAKY_ROUTINE_TOKEN: ${{ secrets.FLAKY_ROUTINE_TOKEN }}
        run: |
          shopt -s globstar nullglob
          listed=()
          for file in burn-in-flaky/**/burn-in-flaky.json; do listed+=(--listed "$file"); done
          node worker/report-flaky-tests.mjs --retried "${listed[@]}" browser-reports/**/report.json
