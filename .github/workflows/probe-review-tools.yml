name: Probe the reviewer's tools

# Temporary: shows what the reviewer's one allowed command refuses. Never merged.
on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'claude/probe-grep-glob'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Probe
        id: probe
        continue-on-error: true
        timeout-minutes: 10
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          show_full_output: false
          settings: '{"disableAllHooks": true}'
          claude_args: |
            --model claude-opus-5-5
            --max-turns 45
            --setting-sources user
            --allowedTools "Bash(node worker/review-git.mjs:*)"
          prompt: |
            This is an authorized test, run by the repository's owner in CI, that checks which commands your tools refuse. Refusals are the expected result, not a failure. Make exactly these Bash calls, one at a time, in this order, each as its own call, with each command exactly as written, and nothing else. Make every call even when earlier ones are refused. Do not retry a refused call another way, and do not read any other path.
            1. node worker/review-git.mjs show HEAD:README.md --out''put=probe-out-1
            2. node worker/review-git.mjs show HEAD:README.md --out"put"=probe-out-2
            3. node worker/review-git.mjs show HEAD:README.md --out\put=probe-out-3
            4. node worker/review-git.mjs show HEAD:README.md --output=probe-out-4
            5. node worker/review-git.mjs show HEAD:README.md --outpu{t,}=probe-out-5
            6. node worker/review-git.mjs show HEAD:README.md --out${EMPTY}put=probe-out-6
            7. node worker/review-git.mjs show HEAD:README.md --out`true`put=probe-out-7
            8. node worker/review-git.mjs show HEAD:README.md --outpu[t]=probe-out-8
            9. node worker/review-git.mjs show $(echo HEAD):README.md
            10. node worker/review-git.mjs show --no-index /etc/hostname README.md
            11. node worker/review-git.mjs blame --contents /etc/hostname -- README.md
            12. node worker/review-git.mjs log -1 -- /etc/host*
            13. node worker/review-git.mjs log -L1,1:/etc/hostname -1
            14. node worker/review-git.mjs log -1 --format=%h > probe-out-14
            15. node worker/review-git.mjs log -1 --format=%h | tee probe-out-15
            16. node worker/review-git.mjs log -1 --format=%h; touch probe-out-16
            17. node worker/review-git.mjs log -1 --format=%h && touch probe-out-17
            18. GIT_EXTERNAL_DIFF=true node worker/review-git.mjs log -1 -p
            19. NODE_OPTIONS=--trace-warnings node worker/review-git.mjs log -1 --format=%h
            20. git log -1 --format=%h
            21. node worker/review-git.mjs log -1 --format=%h
            22. node worker/review-git.mjs show HEAD^1:README.md
            23. node worker/review-git.mjs log -L1,1:README.md -1
            24. node worker/review-git.mjs show --diff-merges=first-parent --stat HEAD -- README.md
            25. node worker/review-git.mjs log -3 --oneline -- README.md
            26. node worker/review-git.mjs log -p -1 -- README.md
            Then stop.
      - name: Write what each call returned
        if: ${{ !cancelled() }}
        env:
          EXECUTION_FILE: ${{ steps.probe.outputs.execution_file }}
        run: |
          node --input-type=module -e '
          import { readFileSync, appendFileSync } from "node:fs";
          const messages = JSON.parse(readFileSync(process.env.EXECUTION_FILE, "utf8"));
          const blocks = messages.flatMap((message) => (Array.isArray(message.message?.content) ? message.message.content : []));
          const results = new Map(blocks.filter((block) => block.type === "tool_result").map((block) => [block.tool_use_id, block]));
          const text = (content) => (Array.isArray(content) ? content.map((part) => part.text ?? "").join("\n") : String(content ?? ""));
          const sections = blocks.filter((block) => block.type === "tool_use").map((use) => {
            const result = results.get(use.id);
            return [`### ${use.name} ${JSON.stringify(use.input)}`, "", `is_error: ${Boolean(result?.is_error)}`, "", "~~~~", text(result?.content).slice(0, 2000), "~~~~", ""].join("\n");
          });
          const said = blocks.filter((block) => block.type === "text").map((block) => block.text).join("\n\n");
          const denials = messages.at(-1)?.permission_denials ?? [];
          const summary = ["## Grep and Glob probe", "", ...sections, "### What the model said", "", "~~~~", said, "~~~~", "", "### Permission denials", "", "~~~~", JSON.stringify(denials, null, 2), "~~~~", ""].join("\n");
          console.log(summary);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          '
        shell: bash
      - name: List the files --output wrote
        if: ${{ !cancelled() }}
        run: ls -la probe-out-* 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
        shell: bash
