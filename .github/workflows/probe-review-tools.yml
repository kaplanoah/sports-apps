name: Probe the reviewer's tools

# Temporary: shows that the reviewer's tools refuse reads outside the checkout. Deleted before the
# pull request is ready.
on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'claude/lock-down-review'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: allow list alone
            settings: '{"disableAllHooks": true}'
          - name: allow list and fence
            settings: '{"disableAllHooks": true, "permissions": {"blockReadsOutsideWorkingDirectories": true}}'
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Probe
        id: probe
        continue-on-error: true
        timeout-minutes: 10
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          show_full_output: false
          settings: ${{ matrix.settings }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 30
            --setting-sources user
            --allowedTools "Bash(git log:*),Bash(git show:*)"
          prompt: |
            This is a permissions test of your tools. Make exactly these tool calls, one at a time, in this order, and nothing else. Do not retry a refused call another way, and do not read any other path.
            1. Read the file /etc/hostname.
            2. Read the file /etc/os-release.
            3. Grep for the pattern "NAME" with path /etc/os-release.
            4. Glob for the pattern "host*" with path /etc.
            5. Bash: git diff --no-index /etc/hostname /dev/null
            6. Bash: git blame --contents /etc/hostname -- README.md
            7. Bash: git log -L1,1:/etc/hostname
            8. Read the file README.md in the working directory.
            9. Grep for the pattern "sports" with path README.md.
            10. Glob for the pattern "*.md" in the working directory.
            11. Bash: git log -1 --format=%h
            12. Bash: git show HEAD^1:README.md
            13. Bash: gh pr list --label beta --state open
            Then stop.
      - name: Write what each call returned
        if: ${{ !cancelled() }}
        env:
          EXECUTION_FILE: ${{ steps.probe.outputs.execution_file }}
          PROBE: ${{ matrix.name }}
        run: |
          node --input-type=module -e '
          import { readFileSync, appendFileSync } from "node:fs";
          const messages = JSON.parse(readFileSync(process.env.EXECUTION_FILE, "utf8"));
          const blocks = messages.flatMap((message) => (Array.isArray(message.message?.content) ? message.message.content : []));
          const results = new Map(blocks.filter((block) => block.type === "tool_result").map((block) => [block.tool_use_id, block]));
          const text = (content) => (Array.isArray(content) ? content.map((part) => part.text ?? "").join(" ") : String(content ?? ""));
          const rows = blocks.filter((block) => block.type === "tool_use").map((use) => {
            const result = results.get(use.id);
            const said = text(result?.content).replace(/\s+/g, " ").slice(0, 160).replace(/\|/g, "\\|");
            return `| ${use.name} | \`${JSON.stringify(use.input).replace(/\|/g, "\\|")}\` | ${result?.is_error ? "refused or failed" : "returned"} | ${said} |`;
          });
          const denials = messages.at(-1)?.permission_denials ?? [];
          const table = [`## ${process.env.PROBE}`, "", "| Tool | Input | Outcome | What it said |", "| --- | --- | --- | --- |", ...rows, "", `Permission denials: ${denials.length}`, ""].join("\n");
          console.log(table);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, table);
          '
        shell: bash
