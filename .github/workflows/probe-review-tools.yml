name: Probe the reviewer's tools

# Temporary: shows what the reviewer's one allowed command refuses. Never merged.
on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'claude/probe-grep-glob'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Probe
        id: probe
        continue-on-error: true
        timeout-minutes: 10
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          show_full_output: false
          settings: '{"disableAllHooks": true}'
          claude_args: |
            --model claude-opus-5-5
            --max-turns 45
            --setting-sources user
            --allowedTools "Bash(node worker/review-git.mjs:*)"
          prompt: |
            The repository's owner is checking which forms of one harmless command your Bash permissions allow. Each command only prints the latest commit. Run these six Bash commands, one call each, in this order, exactly as written. Run every one, even after one is denied, and don't rewrite or retry a denied one. Then stop.
            1. node worker/review-git.mjs log -1 --oneline
            2. node worker/review-git.mjs log -1 $(echo HEAD)
            3. node worker/review-git.mjs log -1 `echo HEAD`
            4. FOO=1 node worker/review-git.mjs log -1
            5. node worker/review-git.mjs log -1 > out.txt
            6. node worker/review-git.mjs log -1 ; echo done
      - name: Write what each call returned
        if: ${{ !cancelled() }}
        env:
          EXECUTION_FILE: ${{ steps.probe.outputs.execution_file }}
        run: |
          node --input-type=module -e '
          import { readFileSync, appendFileSync } from "node:fs";
          const messages = JSON.parse(readFileSync(process.env.EXECUTION_FILE, "utf8"));
          const blocks = messages.flatMap((message) => (Array.isArray(message.message?.content) ? message.message.content : []));
          const results = new Map(blocks.filter((block) => block.type === "tool_result").map((block) => [block.tool_use_id, block]));
          const text = (content) => (Array.isArray(content) ? content.map((part) => part.text ?? "").join("\n") : String(content ?? ""));
          const sections = blocks.filter((block) => block.type === "tool_use").map((use) => {
            const result = results.get(use.id);
            return [`### ${use.name} ${JSON.stringify(use.input)}`, "", `is_error: ${Boolean(result?.is_error)}`, "", "~~~~", text(result?.content).slice(0, 2000), "~~~~", ""].join("\n");
          });
          const said = blocks.filter((block) => block.type === "text").map((block) => block.text).join("\n\n");
          const denials = messages.at(-1)?.permission_denials ?? [];
          const summary = ["## Grep and Glob probe", "", ...sections, "### What the model said", "", "~~~~", said, "~~~~", "", "### Permission denials", "", "~~~~", JSON.stringify(denials, null, 2), "~~~~", ""].join("\n");
          console.log(summary);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          '
        shell: bash
      - name: List the files --output wrote
        if: ${{ !cancelled() }}
        run: ls -la out.txt 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
        shell: bash
