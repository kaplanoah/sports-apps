name: Blind provider trial session

on:
  workflow_call:
    inputs:
      provider:
        type: string
        required: true
      case:
        type: string
        required: true
      portion:
        type: string
        required: true
    secrets:
      TRUSTED_REVIEW_OPENAI_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false

permissions:
  contents: read

env:
  TRIAL_CASE: ${{ inputs.case }}
  TRIAL_PROVIDER: ${{ inputs.provider }}
  PORTION: ${{ inputs.portion }}
  TRUSTED_CODEX_REVIEW_ENABLED: ${{ vars.TRUSTED_CODEX_REVIEW_ENABLED }}

jobs:
  request:
    if: &trial-authority github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.run_attempt == 1 && vars.TRUSTED_CODEX_REVIEW_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      node-version: ${{ steps.node.outputs.node-version }}
      claude-model: ${{ steps.request.outputs.claude-model }}
      claude-turns: ${{ steps.request.outputs.claude-turns }}
      claude-timeout: ${{ steps.request.outputs.claude-timeout }}
      claude-schema: ${{ steps.request.outputs.claude-schema }}
      claude-prompt: ${{ steps.request.outputs.claude-prompt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-trial-input
          path: ${{ runner.temp }}/trial-download
      - run: tar -xzf "$RUNNER_TEMP/trial-download/trial-input.tgz" -C "$RUNNER_TEMP"
      - if: inputs.portion == 'integration'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: review-trial-session-*
          path: ${{ runner.temp }}/trial-portions
      - name: Validate prior work and prepare the complete native request
        id: request
        run: node worker/review-trial.mjs request "$PORTION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trial-session-input-${{ inputs.portion }}
          path: ${{ runner.temp }}/trial-session-input.tgz
          retention-days: 1

  model:
    needs: request
    if: *trial-authority
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ needs.request.outputs.node-version }}
          package-manager-cache: false
      - name: Start the session elapsed-time record
        run: node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP + "/trial-start.txt", process.hrtime.bigint().toString())'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-trial-input
          path: ${{ runner.temp }}/trial-base
      - run: tar -xzf "$RUNNER_TEMP/trial-base/trial-input.tgz" -C "$RUNNER_TEMP"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trial-session-input-${{ inputs.portion }}
          path: ${{ runner.temp }}/trial-download
      - run: tar -xzf "$RUNNER_TEMP/trial-download/trial-session-input.tgz" -C "$RUNNER_TEMP"
      - name: Install only the historical checkout and blind context
        run: |
          git clone --quiet "$RUNNER_TEMP/trial/snapshot.bundle" "$GITHUB_WORKSPACE"
          ln -s "$RUNNER_TEMP/trial/data" "$GITHUB_WORKSPACE/.review"
          echo "REVIEW_CHECKOUT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Native Codex investigation
        id: codex
        if: inputs.provider == 'codex'
        continue-on-error: true
        uses: openai/codex-action@c05cfd74ad95c626cdf05c6685e62becc3bf7813
        env:
          BASH_ENV: ${{ runner.temp }}/codex-log-capture.sh
        with:
          openai-api-key: ${{ secrets.TRUSTED_REVIEW_OPENAI_API_KEY }}
          codex-version: 0.164.0
          model: gpt-6.1-sol
          effort: high
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          codex-home: ${{ runner.temp }}/codex-home
          working-directory: ${{ github.workspace }}
          prompt-file: ${{ runner.temp }}/trial/prompt.txt
          output-schema-file: ${{ runner.temp }}/trial/schema.json
          output-file: ${{ runner.temp }}/trial-answer.json
          codex-args: '["--ephemeral", "--json"]'
      - name: Claude investigation
        id: claude
        if: inputs.provider == 'claude'
        timeout-minutes: ${{ needs.request.outputs.claude-timeout }}
        continue-on-error: true
        uses: anthropics/claude-code-action@e4a6faad497d33dbc7144135c75e41f82f0bf6c0 # v1.0.255
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          show_full_output: false
          settings: '{"disableAllHooks": true}'
          claude_args: |
            --model ${{ needs.request.outputs.claude-model }}
            --max-turns ${{ needs.request.outputs.claude-turns }}
            --setting-sources user
            --tools "Read,Bash"
            --add-dir ${{ runner.temp }}/trial/data
            --strict-mcp-config
            --mcp-config '{"mcpServers":{}}'
            --allowedTools "Bash(node ${{ runner.temp }}/trial/controls/review-git.mjs:*)"
            --json-schema '${{ needs.request.outputs.claude-schema }}'
          prompt: ${{ needs.request.outputs.claude-prompt }}
      # Current source and its hidden-case answers arrive only after the model exits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: always()
        with:
          ref: ${{ github.sha }}
          path: trial-validator
          persist-credentials: false
      - name: Validate the exact result and retain only answer, coverage and numeric usage
        if: always()
        env:
          MODEL_OUTCOME: ${{ inputs.provider == 'codex' && steps.codex.outcome || steps.claude.outcome }}
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: node trial-validator/worker/review-trial.mjs collect "$PORTION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: review-trial-session-${{ inputs.portion }}
          path: ${{ runner.temp }}/trial-result/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: review-trial-private-${{ inputs.portion }}
          path: ${{ runner.temp }}/trial-private/evidence.cms
          if-no-files-found: error
          retention-days: 14
