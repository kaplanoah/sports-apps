name: Phone ready

# Tells the owner on a red pull request when their phone test is all that's left. CI and the
# trusted review each finish on their own, so whichever comes last finds the pull request ready.
# CI starting at a push takes down the comment the push outdated, and the review's reconcile, which
# runs on a label, keeps its beta line current. Resolving a thread starts no workflow, so a run on
# the quarter hour finds a pull request whose last open thread was resolved after both.
on:
  workflow_run:
    workflows: [CI, Reconcile trusted review]
    types: [requested, completed]
  schedule:
    - cron: "2,17,32,47 * * * *"

permissions:
  contents: read
  pull-requests: write
  issues: read
  checks: read
  statuses: read

concurrency:
  group: phone-ready
  cancel-in-progress: false

jobs:
  tell:
    # A reconcile starting changes nothing yet.
    if: >-
      github.event_name == 'schedule' || github.event.workflow_run.name == 'CI' ||
      github.event.action == 'completed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Never check out a workflow_run's head or execute any pull request's code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Comment on red pull requests waiting only on the phone
        env:
          GH_TOKEN: ${{ github.token }}
        run: node worker/phone-ready.mjs
