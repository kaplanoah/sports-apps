name: Trusted review of an area

on:
  workflow_call:
    inputs:
      stage:
        type: string
        required: true
      area:
        type: number
        required: true
      name:
        type: string
        required: true
      merge:
        type: string
        required: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false

permissions:
  contents: read

env:
  REVIEW_MERGE: ${{ inputs.merge }}
  REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
  REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
  REVIEW_TRUSTED: ${{ github.sha }}
  PR: ${{ github.event.pull_request.number }}
  STAGE: ${{ inputs.stage }}
  AREA: ${{ inputs.area }}

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Preserve the trusted source before checking out reviewed data
        run: |
          mkdir "$RUNNER_TEMP/trusted"
          git archive "$REVIEW_TRUSTED" | tar -x -C "$RUNNER_TEMP/trusted"
      - name: Prepare a fresh reviewed checkout
        id: prepare
        run: node "$RUNNER_TEMP/trusted/worker/trusted-review.mjs" prepare
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: trusted-review-plan
          path: ${{ runner.temp }}/review-input/
      - name: Validate the review plan
        run: node "$RUNNER_TEMP/trusted/worker/trusted-review.mjs" import "$RUNNER_TEMP/review-input"
      - name: Review
        id: review
        continue-on-error: true
        timeout-minutes: 15
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: &oauth-token ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: &api-key ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: &run-token ${{ github.token }}
          show_full_output: false
          settings: &review-settings '{"disableAllHooks": true}'
          claude_args: &find-args |
            --model claude-opus-5-5
            --max-turns 150
            --setting-sources user
            --tools "Read,Bash"
            --add-dir ${{ env.REVIEW_DATA }}
            --strict-mcp-config
            --mcp-config '{"mcpServers":{}}'
            --allowedTools "Bash(node ${{ runner.temp }}/trusted/worker/review-git.mjs:*)"
            --json-schema '{"type":"object","properties":{"candidates":{"type":"array","items":{"type":"object","properties":{"path":{"type":"string"},"line":{"type":"integer"},"weight":{"type":"string","enum":["Important","Nit","Pre-existing"]},"confidence":{"type":"string","enum":["high","medium","low"]},"claim":{"type":"string"},"when":{"type":"string"},"fix":{"type":"string"}},"required":["path","line","weight","confidence","claim","when","fix"]}},"unjudged":{"type":"array","items":{"type":"object","properties":{"file":{"type":"string"},"why":{"type":"string"}},"required":["file","why"]}}},"required":["candidates","unjudged"]}'
          prompt: |
            You are the reviewer of pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}. Its change is split into areas by what the files are about, each with a reviewer of its own. You review area ${{ inputs.area }}, "${{ inputs.name }}", for every item in the guide's "What to look for".

            1. Read `.review/REVIEW.md`, the review guide as the default branch has it, and follow it, and `.review/AGENTS.md`, each whole. AGENTS.md and the rule files your area lists hold the rules the code keeps.
            2. Read `.review/pull-request.md`: the pull request's title and description, and every review thread on it so far, with its replies and whether it's resolved.
            3. Read `.review/${{ env.STAGE }}.md`, which lists each area's files, the diff files that hold their change, and the rule files for them. Read every diff file and rule file listed under Area ${{ inputs.area }}, each whole, with Read and no offset or limit, or, should Read say one is too big, in pieces with offset and limit that cover all of it. A step after you checks your reads, and the review fails on any line of your area's diffs or rule files you didn't read.
            4. Read what else you need to judge them: the files as the pull request leaves them, other areas' diffs, callers, and copies, with Read, which reaches only this checkout. Search and history come from `node ${{ runner.temp }}/trusted/worker/review-git.mjs`, which runs git grep, git log, or git show: `node ${{ runner.temp }}/trusted/worker/review-git.mjs grep -n -F -e <text> -- <path>` finds text in tracked checkout files, and `node ${{ runner.temp }}/trusted/worker/review-git.mjs grep -l -i -w -E -e <pattern> -- <path>` lists matching files. Search takes `-n`, `-l`, `-i`, `-w`, `-F`, `-E`, and one or more `-e <pattern>` arguments; paths follow `--`. History's base is HEAD^1: `node ${{ runner.temp }}/trusted/worker/review-git.mjs log -p -- <path>` for a file's changes, `node ${{ runner.temp }}/trusted/worker/review-git.mjs log -L<start>,<end>:<path>` or `node ${{ runner.temp }}/trusted/worker/review-git.mjs log -L:<function>:<path>` for a range's or a function's, `node ${{ runner.temp }}/trusted/worker/review-git.mjs show HEAD^1:<path>` for the base's copy, and `node ${{ runner.temp }}/trusted/worker/review-git.mjs show --diff-merges=first-parent HEAD -- <path>` for a file's whole change. It refuses options other than those its usage lists and any path outside this checkout. The whole history is here. Run each command on its own, with no pipes or redirects. For each new helper, constant, rule, or wording, search the repo for one that already does the same, starting from `.review/stale-names.md`, which lists the first places that still name each thing the change removed. For each change to behavior, find the test that would fail without it, or report that none does.
            5. List every problem you find, not a sample, each once, naming every place it shows, in both apps too. Include one you're unsure of, with your confidence: the check across areas confirms each against the code before anything is posted. Leave out one a thread already raised, unless its reply is wrong or a fix it claims didn't hold, and then say so.
            6. Post nothing. End with your answer: each problem, on the line the diff changes nearest its first place, naming that place if it's another; and each file of your area you read but couldn't judge from the code, and why.
      - name: Diagnose the find attempt
        continue-on-error: true
        if: ${{ always() && (steps.review.outcome == 'success' || steps.review.outcome == 'failure' || steps.review.outcome == 'cancelled') }}
        env:
          REVIEW_ATTEMPT: find
          CLAUDE_OUTCOME: ${{ steps.review.outcome }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          CLAUDE_OUTPUT_PRESENT: ${{ steps.review.outputs.structured_output != '' }}
        run: node "$RUNNER_TEMP/trusted/worker/review-diagnostics.mjs"
      - name: Find what the review left unread
        id: first
        if: ${{ !cancelled() }}
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          STRUCTURED_OUTPUT: ${{ steps.review.outputs.structured_output }}
        run: node "$RUNNER_TEMP/trusted/worker/trusted-review.mjs" find "$AREA" >> "$GITHUB_OUTPUT"
      - name: Review what's left
        id: again
        if: &retry-due ${{ !cancelled() && steps.first.outcome == 'success' && (steps.first.outputs.unread != '' || steps.first.outputs.answered != 'true') }}
        continue-on-error: true
        timeout-minutes: 15
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: *oauth-token
          anthropic_api_key: *api-key
          github_token: *run-token
          show_full_output: false
          settings: *review-settings
          claude_args: *find-args
          prompt: |
            You are the reviewer of pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}. You review area ${{ inputs.area }}, "${{ inputs.name }}", for every item in the guide's "What to look for". An earlier try didn't finish. Files it left unread: ${{ steps.first.outputs.unread || 'none' }}. ${{ steps.first.outputs.answered == 'true' && 'Its answer is kept, so judge only what those files change.' || 'It gave no answer, so judge your whole area again.' }}

            1. Read `.review/REVIEW.md`, the review guide as the default branch has it, and follow it, and `.review/AGENTS.md`, each whole. AGENTS.md and the rule files your area lists hold the rules the code keeps. `.review/pull-request.md` holds the pull request's description and every review thread on it.
            2. Read each file the earlier try left unread, under `.review/`, whole, with Read and no offset or limit, or, should Read say one is too big, in pieces with offset and limit that cover all of it. A step after you checks your reads, and the review fails on any line of them you didn't read. A rule file changes nothing itself, so judge your area's whole diff against each rule file the earlier try left unread. `.review/${{ env.STAGE }}.md` lists your area's diff files and rule files, to read as you need.
            3. Read what else you need, with Read, which reaches only this checkout. Search and history come from `node ${{ runner.temp }}/trusted/worker/review-git.mjs`, which runs git grep, git log, or git show: `node ${{ runner.temp }}/trusted/worker/review-git.mjs grep -n -F -e <text> -- <path>` finds text in tracked checkout files, and `node ${{ runner.temp }}/trusted/worker/review-git.mjs grep -l -i -w -E -e <pattern> -- <path>` lists matching files. Search takes `-n`, `-l`, `-i`, `-w`, `-F`, `-E`, and one or more `-e <pattern>` arguments; paths follow `--`. History's base is HEAD^1: `node ${{ runner.temp }}/trusted/worker/review-git.mjs log -p -- <path>` for a file's changes, `node ${{ runner.temp }}/trusted/worker/review-git.mjs log -L<start>,<end>:<path>` or `node ${{ runner.temp }}/trusted/worker/review-git.mjs log -L:<function>:<path>` for a range's or a function's, `node ${{ runner.temp }}/trusted/worker/review-git.mjs show HEAD^1:<path>` for the base's copy, and `node ${{ runner.temp }}/trusted/worker/review-git.mjs show --diff-merges=first-parent HEAD -- <path>` for a file's whole change. It refuses options other than those its usage lists and any path outside this checkout. Run each command on its own, with no pipes or redirects. `.review/stale-names.md` lists the first places that still name each thing the change removed.
            4. List every problem you find in what you judge, each once, naming every place it shows, unsure ones too, with your confidence. Leave out one a thread already raised, unless its reply is wrong or a fix it claims didn't hold.
            5. Post nothing. End with your answer: each problem, on the line the diff changes nearest its first place, and each file you read but couldn't judge from the code, and why.
      - name: Diagnose the retry attempt
        continue-on-error: true
        if: ${{ always() && (steps.again.outcome == 'success' || steps.again.outcome == 'failure' || steps.again.outcome == 'cancelled') }}
        env:
          REVIEW_ATTEMPT: retry
          CLAUDE_OUTCOME: ${{ steps.again.outcome }}
          EXECUTION_FILE: ${{ steps.again.outputs.execution_file }}
          CLAUDE_OUTPUT_PRESENT: ${{ steps.again.outputs.structured_output != '' }}
        run: node "$RUNNER_TEMP/trusted/worker/review-diagnostics.mjs"
      - name: Find what's still unread
        id: last
        if: *retry-due
        env:
          EXECUTION_FILE: ${{ steps.again.outputs.execution_file }}
          STRUCTURED_OUTPUT: ${{ steps.again.outputs.structured_output }}
        run: node "$RUNNER_TEMP/trusted/worker/trusted-review.mjs" find "$AREA" >> "$GITHUB_OUTPUT"
      - name: Seal the reviewer record
        if: ${{ !cancelled() }}
        run: node "$RUNNER_TEMP/trusted/worker/trusted-review.mjs" export "find-$AREA"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trusted-review-find-${{ env.AREA }}
          path: ${{ env.REVIEW_UPLOAD }}/trusted-review-find-${{ env.AREA }}/
          retention-days: 14
          # A re-run of the job uploads its record again.
          overwrite: true
      # So that re-running the failed jobs reviews this area again.
      - name: Fail when parts are still unread or the reviewer gave no answer
        if: ${{ !cancelled() && (steps.last.outputs.unread != '' || steps.last.outputs.answered == 'false') }}
        run: |
          echo "::error::This area's reviewer didn't read every line of its diffs and rule files, or gave no answer."
          exit 1
