name: Historical review provider trial

on:
  workflow_dispatch:
    inputs:
      provider:
        type: choice
        required: true
        options: [claude, codex]
      case:
        type: choice
        required: true
        options: [case-1, case-2, range-694, range-734]
      evidence-certificate:
        description: Public evidence encryption certificate, never a private key or API credential
        type: string
        required: true

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.run_attempt == 1 && vars.TRUSTED_CODEX_REVIEW_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      portions: ${{ steps.prepare.outputs.portions }}
      integration: ${{ steps.prepare.outputs.integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Freeze the blind historical input, complete range and trusted rules
        id: prepare
        env:
          TRIAL_CASE: ${{ inputs.case }}
          TRIAL_PROVIDER: ${{ inputs.provider }}
          TRIAL_EVIDENCE_CERTIFICATE: ${{ inputs.evidence-certificate }}
          TRUSTED_CODEX_REVIEW_ENABLED: ${{ vars.TRUSTED_CODEX_REVIEW_ENABLED }}
        run: node worker/review-trial.mjs prepare
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: review-trial-input
          path: ${{ runner.temp }}/trial-input.tgz
          retention-days: 1

  investigate:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        portion: ${{ fromJSON(needs.prepare.outputs.portions) }}
    uses: ./.github/workflows/provider-review-session.yml
    with:
      provider: ${{ inputs.provider }}
      case: ${{ inputs.case }}
      portion: ${{ format('{0}', matrix.portion) }}
    secrets:
      TRUSTED_REVIEW_OPENAI_API_KEY: ${{ inputs.provider == 'codex' && secrets.TRUSTED_REVIEW_OPENAI_API_KEY || '' }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.provider == 'claude' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
      ANTHROPIC_API_KEY: ${{ inputs.provider == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}

  integrate:
    needs: [prepare, investigate]
    if: needs.prepare.outputs.integration == 'true'
    uses: ./.github/workflows/provider-review-session.yml
    with:
      provider: ${{ inputs.provider }}
      case: ${{ inputs.case }}
      portion: integration
    secrets:
      TRUSTED_REVIEW_OPENAI_API_KEY: ${{ inputs.provider == 'codex' && secrets.TRUSTED_REVIEW_OPENAI_API_KEY || '' }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.provider == 'claude' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
      ANTHROPIC_API_KEY: ${{ inputs.provider == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}
