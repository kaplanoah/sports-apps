name: Preview build

# Builds, as beta, each app a pull request labeled preview changes, for the Preview workflow to
# upload as its previews (worker/preview.mjs). The pull request's own code runs only here, with no
# secret and no environment.
on:
  pull_request:
    types: [labeled, unlabeled, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  # A fork's pull request never gets a preview, and only the owner's sessions label one. Taking the
  # label off, or closing, builds too, so the Preview workflow deletes the previews.
  build:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (((github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      github.event.label.name == 'preview') ||
      ((github.event.action == 'synchronize' || github.event.action == 'reopened' ||
      github.event.action == 'closed') &&
      contains(github.event.pull_request.labels.*.name, 'preview')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A newer event's build replaces a running one, so the Preview workflow gets builds in order.
    concurrency:
      group: preview-build-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # All of the history, so the pull request can be compared with where it left its base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build the pull request's previews
        env:
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node worker/preview.mjs build "$PULL_REQUEST" "$BASE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: preview
          path: preview/
          retention-days: 1
          if-no-files-found: error
