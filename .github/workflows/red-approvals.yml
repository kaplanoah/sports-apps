name: Red approvals

# Refresh existing phone statuses when their main/deploy evidence changes.
# This is asynchronous: sessions still serialize red merges through deployment.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read
  actions: read
  statuses: write

concurrency:
  group: red-approvals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Never check out a workflow_run's head or execute any pull request's code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --no-audit
      - name: Recheck approved red pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: node worker/red-approval.mjs
