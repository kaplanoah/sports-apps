name: Code scanning alerts

# A Claude session's GitHub access can't read code scanning, so the routine that triages CodeQL's
# findings starts this run and reads the alerts from its log (worker/list-code-scanning-alerts.mjs).
on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: List code-scanning alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node worker/list-code-scanning-alerts.mjs
