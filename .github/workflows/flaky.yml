name: Flaky tests
run-name: ${{ inputs.tests && format('Repeat {0} on {1}', inputs.tests, inputs.ref) || 'Flaky tests' }}

# Pull requests retry a failed browser test once, so a test that fails only now and then can pass
# them. Each night, main's browser tests run three times over with no retry, and one open issue
# names each test that failed in any run (worker/report-flaky-tests.mjs). Run by hand, it repeats
# the tests it's given on any branch, on the machine CI uses, WebKit included, to reproduce a flaky
# test and to show a fix holds.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to test
        default: main
      tests:
        description: Tests to run, as paths with an optional :line, split by spaces; every test when empty
        default: ""
      project:
        description: Playwright project to run, like wnba-webkit; every project when empty
        default: ""
      repeat:
        description: How many times to run each test
        default: "3"

permissions:
  contents: read

jobs:
  # Playwright's own image holds Chromium and WebKit and the system libraries they need, so one
  # machine runs every project. Its tag is the Playwright version package.json pins.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - id: modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      # Every test runs to the end, however many fail, so the issue names each flaky one.
      - name: Run the browser tests over and over
        shell: bash
        env:
          TESTS: ${{ inputs.tests }}
          PROJECT: ${{ inputs.project }}
          REPEAT: ${{ inputs.repeat || '3' }}
        run: |
          read -ra tests <<< "$TESTS"
          options=(--repeat-each="$REPEAT" --retries=0 --max-failures=0)
          if [ -n "$PROJECT" ]; then options+=(--project="$PROJECT"); fi
          npm run test:browser -- "${options[@]}" "${tests[@]}"
      # Only the nightly run of main reports, since a run by hand may test a branch.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        with:
          name: nightly-report
          path: test-results/report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  # The one writer of the issue's table, once a night, so no two writes race. It adds this run's
  # tests and those of each artifact CI's runs kept that the issue doesn't list as counted, read
  # with GitHub's CLI. A test new to the issue starts the routine that fixes flaky tests, through
  # its API trigger.
  report:
    needs: browser
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-report
          path: nightly-report/
      - name: Name each test that failed in the open issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FLAKY_ROUTINE_URL: ${{ secrets.FLAKY_ROUTINE_URL }}
          FLAKY_ROUTINE_TOKEN: ${{ secrets.FLAKY_ROUTINE_TOKEN }}
        run: node worker/report-flaky-tests.mjs nightly-report/report.json
