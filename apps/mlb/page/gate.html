<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MLB" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0d1f16" />
  <title>MLB</title>
  <link rel="preload" href="fonts/chivo-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="shared/type.css" />
  <link rel="stylesheet" href="shared/gate.css" />
  <link rel="stylesheet" href="styles.css" />

  <body class="gate-page">
    <main class="gate">
      <img class="gate-icon" src="icon-180.png" alt="" />
      <h1 class="gate-title">Enter your access code</h1>
      <form class="gate-form" id="gateForm" novalidate>
        <input
          class="code-field"
          id="codeField"
          name="code"
          type="text"
          autocomplete="off"
          autocapitalize="characters"
          autocorrect="off"
          spellcheck="false"
          enterkeyhint="go"
          placeholder="Code"
          aria-label="Access code"
          aria-describedby="gateMessage"
        />
        <button type="submit" class="open-button">Open</button>
        <p class="gate-message" id="gateMessage" role="alert"></p>
      </form>
    </main>
  </body>

  <script type="module" src="shared/gate.js"></script>
</html>
