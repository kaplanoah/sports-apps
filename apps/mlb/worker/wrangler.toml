name = "mlb-app"
main = "dist/worker.mjs"
compatibility_date = "2026-09-01"
# npm run build -- mlb bundles dist/worker.mjs with esbuild (worker/build.mjs); deploys build it themselves.
no_bundle = true

[observability]
enabled = true

# Traces time each fetch the Worker and its store make, which the logs alone can't show.
[observability.traces]
enabled = true

# worker/deploy.mjs declares the same bindings and migrations for npm run deploy:api.
[[durable_objects.bindings]]
name = "STORE"
class_name = "SeasonStore"

[[ratelimits]]
name = "ACCESS_LIMIT"
namespace_id = "2701"

[ratelimits.simple]
limit = 10
period = 60

# Each service under services/, by its name in capitals, on the app's own channel.
[[services]]
binding = "ACCOUNTS"
service = "accounts"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SeasonStore"]

# The beta channel's Worker, deployed from the beta branch to use a change on a phone before it
# merges, with its own store, key, and address. Durable Objects and rate limits aren't inherited.
[env.beta]
name = "mlb-app-beta"
preview_urls = false

[[env.beta.durable_objects.bindings]]
name = "STORE"
class_name = "SeasonStore"

[[env.beta.ratelimits]]
name = "ACCESS_LIMIT"
namespace_id = "2701"

[env.beta.ratelimits.simple]
limit = 10
period = 60

[[env.beta.services]]
binding = "ACCOUNTS"
service = "accounts-beta"

# A preview of the beta Worker for each pull request labeled preview (worker/preview.mjs), answering
# only at its own name under the app's preview host. It serves its own page files and asks beta's
# Worker, by this binding, for everything else, so it holds no secret and reads beta's store. Its
# store class gets an empty namespace of its own, which nothing binds.
[env.beta.previews.observability]
enabled = true

[[env.beta.previews.services]]
binding = "BETA"
service = "mlb-app-beta"
entrypoint = "PreviewEntrypoint"
