name = "wnba-app"
main = "dist/worker.mjs"
compatibility_date = "2026-09-01"
# npm run build -- wnba bundles dist/worker.mjs with esbuild (worker/build.mjs); deploys build it themselves.
no_bundle = true

[observability]
enabled = true

# Traces time each fetch the Worker and its store make, which the logs alone can't show.
[observability.traces]
enabled = true

# worker/deploy.mjs declares the same bindings and migrations for npm run deploy:api.
[[durable_objects.bindings]]
name = "STORE"
class_name = "SeasonStore"

[[ratelimits]]
name = "ACCESS_LIMIT"
namespace_id = "2701"

[ratelimits.simple]
limit = 10
period = 60

# Each service under services/, by its name in capitals, on the app's own channel.
[[services]]
binding = "ACCOUNTS"
service = "accounts"

# Each device's one count a day, on production alone, so testing on beta adds nothing to them.
[[analytics_engine_datasets]]
binding = "DAILY_OPENS"
dataset = "daily_opens"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SeasonStore"]

# The beta channel's Worker, deployed from the beta branch to use a change on a phone before it
# merges, with its own store, key, and address. Durable Objects, rate limits, and datasets aren't inherited.
[env.beta]
name = "wnba-app-beta"

[[env.beta.durable_objects.bindings]]
name = "STORE"
class_name = "SeasonStore"

[[env.beta.ratelimits]]
name = "ACCESS_LIMIT"
namespace_id = "2701"

[env.beta.ratelimits.simple]
limit = 10
period = 60

[[env.beta.services]]
binding = "ACCOUNTS"
service = "accounts-beta"
