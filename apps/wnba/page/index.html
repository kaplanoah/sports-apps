<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script src="shared/release-guard.js"></script>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" id="tabIcon" />
  <link rel="apple-touch-icon" href="icon-180.png" id="homeScreenIcon" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="WNBA" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1d1511" id="themeColor" />
  <title>WNBA</title>
  <meta
    name="description"
    content="Follow the WNBA season: the standings, the teams, the playoff bracket and games, and the news."
  />
  <link
    rel="preload"
    href="fonts/barlow-condensed-400.woff2"
    as="font"
    type="font/woff2"
    crossorigin
  />
  <link
    rel="preload"
    href="fonts/barlow-condensed-500.woff2"
    as="font"
    type="font/woff2"
    crossorigin
  />
  <link
    rel="preload"
    href="fonts/barlow-condensed-600.woff2"
    as="font"
    type="font/woff2"
    crossorigin
  />
  <link rel="preload" href="fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/barlow-500.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/barlow-600.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/barlow-700.woff2" as="font" type="font/woff2" crossorigin />
  <link
    rel="preload"
    href="fonts/barlow-500-italic.woff2"
    as="font"
    type="font/woff2"
    crossorigin
  />
  <link rel="stylesheet" href="shared/type.css" />
  <link rel="stylesheet" href="shared/chrome.css" />
  <link rel="stylesheet" href="shared/diagnostics.css" />
  <link rel="stylesheet" href="shared/game-row.css" />
  <link rel="stylesheet" href="shared/pager.css" />
  <link rel="stylesheet" href="shared/day-strip.css" />
  <link rel="stylesheet" href="shared/game-search.css" />
  <link rel="stylesheet" href="shared/sheet.css" />
  <link rel="stylesheet" href="shared/team-sheet.css" />
  <link rel="stylesheet" href="shared/row-button.css" />
  <link rel="stylesheet" href="shared/game-cards.css" />
  <link rel="stylesheet" href="shared/updates.css" />
  <link rel="stylesheet" href="shared/retry.css" />
  <link rel="stylesheet" href="shared/news.css" />
  <link rel="stylesheet" href="shared/highlights.css" />
  <link rel="stylesheet" href="styles.css" />
  <script src="js/pick-theme.js"></script>
  <script src="shared/open-last-tab.js"></script>
  <script src="shared/show-last-drawn.js"></script>
  <script src="shared/slow-load.js"></script>
  <script type="importmap">
    { "imports": { "#shared/": "./shared/" } }
  </script>

  <div class="home-screen-bar" id="homeScreenBar" hidden></div>
  <header class="top">
    <div class="title-row">
      <h1>WNBA <span class="season-year" id="titleYear" hidden data-last-drawn></span></h1>
    </div>
    <div class="head-right">
      <span class="stamp" id="stamp" role="status" aria-live="polite" hidden data-last-drawn></span>
      <button
        type="button"
        class="settings-btn"
        id="settingsBtn"
        aria-label="Settings"
        aria-haspopup="dialog"
      >
        <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
          <path
            d="M40,86H74.6a30,30,0,0,0,58.8,0H216a6,6,0,0,0,0-12H133.4a30,30,0,0,0-58.8,0H40a6,6,0,0,0,0,12Zm64-24A18,18,0,1,1,86,80,18,18,0,0,1,104,62ZM216,170H197.4a30,30,0,0,0-58.8,0H40a6,6,0,0,0,0,12h98.6a30,30,0,0,0,58.8,0H216a6,6,0,0,0,0-12Zm-48,24a18,18,0,1,1,18-18A18,18,0,0,1,168,194Z"
          />
        </svg>
      </button>
    </div>
  </header>

  <nav class="tabs">
    <div class="tab-bar" id="tabBar">
      <span class="tab-backing" aria-hidden="true"></span>
      <div class="tab-list" role="tablist" aria-label="Views">
        <button
          type="button"
          role="tab"
          id="tab-bracket"
          data-tab="bracket"
          aria-controls="view-bracket"
          aria-selected="true"
          class="active"
        >
          <span class="tab-icon" aria-hidden="true"
            ><svg viewBox="0 0 256 256" fill="currentColor">
              <path
                d="M232,66H206V48a6,6,0,0,0-6-6H56a6,6,0,0,0-6,6V66H24A14,14,0,0,0,10,80V96a38,38,0,0,0,38,38h5.14A78,78,0,0,0,122,189.75V218H96a6,6,0,0,0,0,12h64a6,6,0,0,0,0-12H134V189.75c32.44-2.52,59.43-25.3,68.62-55.75H208a38,38,0,0,0,38-38V80A14,14,0,0,0,232,66ZM48,122A26,26,0,0,1,22,96V80a2,2,0,0,1,2-2H50v34a80.87,80.87,0,0,0,.65,10Zm146-10.9c0,36.62-29.38,66.63-65.5,66.9A66,66,0,0,1,62,112V54H194ZM234,96a26,26,0,0,1-26,26h-2.77a78.45,78.45,0,0,0,.77-10.9V78h26a2,2,0,0,1,2,2Z"
              /></svg></span
          ><span class="tab-label" data-label="Bracket">Bracket</span>
        </button>
        <button
          type="button"
          role="tab"
          id="tab-games"
          data-tab="games"
          aria-controls="view-games"
          aria-selected="false"
          tabindex="-1"
        >
          <span class="tab-icon" aria-hidden="true"
            ><svg viewBox="0 0 256 256" fill="currentColor">
              <path
                d="M128,26A102,102,0,1,0,230,128,102.12,102.12,0,0,0,128,26ZM60,69.09A89.23,89.23,0,0,1,81.78,122H38.2A89.65,89.65,0,0,1,60,69.09ZM38.2,134H81.78A89.23,89.23,0,0,1,60,186.91,89.65,89.65,0,0,1,38.2,134ZM122,217.8a89.66,89.66,0,0,1-53.5-22.34A101.18,101.18,0,0,0,93.82,134H122Zm0-95.8H93.82A101.18,101.18,0,0,0,68.5,60.54,89.66,89.66,0,0,1,122,38.2Zm95.8,0H174.22A89.23,89.23,0,0,1,196,69.09,89.65,89.65,0,0,1,217.8,122ZM134,38.2a89.66,89.66,0,0,1,53.5,22.34A101.18,101.18,0,0,0,162.18,122H134Zm0,179.6V134h28.18a101.18,101.18,0,0,0,25.32,61.46A89.66,89.66,0,0,1,134,217.8Zm62-30.89A89.23,89.23,0,0,1,174.22,134H217.8A89.65,89.65,0,0,1,196,186.91Z"
              /></svg></span
          ><span class="tab-label" data-label="Games">Games</span>
        </button>
        <button
          type="button"
          role="tab"
          id="tab-standings"
          data-tab="standings"
          aria-controls="view-standings"
          aria-selected="false"
          tabindex="-1"
        >
          <span class="tab-icon" aria-hidden="true"
            ><svg viewBox="0 0 256 256" fill="currentColor">
              <path
                d="M238,56v64a6,6,0,0,1-12,0V70.48l-85.76,85.76a6,6,0,0,1-8.48,0L96,120.49,28.24,188.24a6,6,0,0,1-8.48-8.48l72-72a6,6,0,0,1,8.48,0L136,143.51,217.52,62H168a6,6,0,0,1,0-12h64A6,6,0,0,1,238,56Z"
              /></svg></span
          ><span class="tab-label" data-label="Standings">Standings</span>
        </button>
        <button
          type="button"
          role="tab"
          id="tab-news"
          data-tab="news"
          aria-controls="view-news"
          aria-selected="false"
          tabindex="-1"
        >
          <span class="tab-icon" aria-hidden="true"
            ><svg viewBox="0 0 256 256" fill="currentColor">
              <path
                d="M182,112a6,6,0,0,1-6,6H96a6,6,0,0,1,0-12h80A6,6,0,0,1,182,112Zm-6,26H96a6,6,0,0,0,0,12h80a6,6,0,0,0,0-12Zm54-74V184a22,22,0,0,1-22,22H32a22,22,0,0,1-22-21.91V88a6,6,0,0,1,12,0v96a10,10,0,0,0,20,0V64A14,14,0,0,1,56,50H216A14,14,0,0,1,230,64Zm-12,0a2,2,0,0,0-2-2H56a2,2,0,0,0-2,2V184a21.84,21.84,0,0,1-2.41,10H208a10,10,0,0,0,10-10Z"
              /></svg></span
          ><span class="tab-label" data-label="News">News</span>
        </button>
      </div>
      <span class="tab-pill" aria-hidden="true"></span>
    </div>
  </nav>
  <div class="edge-fade" aria-hidden="true"></div>

  <div id="updates" class="updates" hidden data-last-drawn></div>

  <p id="loadNote" class="load-note" role="status" hidden></p>

  <section id="view-bracket" role="tabpanel" aria-labelledby="tab-bracket" class="view active">
    <div id="bracketWrap" data-last-drawn></div>
  </section>

  <section id="view-games" role="tabpanel" aria-labelledby="tab-games" class="view">
    <div
      id="gameSearch"
      class="day-view search-view"
      hidden
      data-last-drawn
      data-start-hidden
    ></div>
    <div id="seasonGames" class="day-view" data-last-drawn></div>
  </section>

  <section id="view-standings" role="tabpanel" aria-labelledby="tab-standings" class="view">
    <div id="standingsPager" data-last-drawn></div>
  </section>

  <section id="view-news" role="tabpanel" aria-labelledby="tab-news" class="view">
    <div id="newsList" data-last-drawn></div>
  </section>

  <dialog id="settingsDialog" class="settings-panel" aria-labelledby="settingsTitle">
    <div class="settings-body">
      <div class="sheet-top">
        <div class="sheet-head">
          <button type="button" class="sheet-close" id="settingsCloseBtn">
            <!-- Phosphor's caret-down, at its Light weight. -->
            <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
              <path
                d="M212.24,100.24l-80,80a6,6,0,0,1-8.48,0l-80-80a6,6,0,0,1,8.48-8.48L128,167.51l75.76-75.75a6,6,0,0,1,8.48,8.48Z"
              />
            </svg>
            <span class="sheet-close-label">Close</span>
          </button>
          <div class="sheet-title">
            <h2 id="settingsTitle">Settings</h2>
          </div>
        </div>
      </div>
      <div class="settings-controls grouped">
        <label class="control-row" hidden>
          <span>Season</span>
          <select id="seasonPicker" class="select-field" aria-label="Season"></select>
        </label>
        <div class="control-row" id="notifyRow" hidden data-last-drawn></div>
        <div class="settings-group" role="group" aria-labelledby="newsSettingsTitle">
          <h3 class="settings-group-label" id="newsSettingsTitle">News</h3>
          <div class="control-row">
            <span class="control-label">
              <span id="teamOutletsTitle">Include dedicated Liberty sources</span>
              <span class="control-note">Beat writers at The IX, NY Post, and more</span>
            </span>
            <button
              type="button"
              role="switch"
              class="switch"
              id="teamOutletsSwitch"
              aria-checked="true"
              aria-labelledby="teamOutletsTitle"
            >
              <span class="switch-knob" aria-hidden="true"></span>
            </button>
          </div>
          <div class="control-row">
            <span class="control-label">
              <span id="paywalledTitle">Include content from The Athletic</span>
              <span class="control-note">Most stories need a subscription</span>
            </span>
            <button
              type="button"
              role="switch"
              class="switch"
              id="paywalledSwitch"
              aria-checked="true"
              aria-labelledby="paywalledTitle"
            >
              <span class="switch-knob" aria-hidden="true"></span>
            </button>
          </div>
        </div>
        <div class="control-row appearance-row">
          <span class="control-label">
            <span id="appearanceTitle">Appearance</span>
            <span class="control-note" id="appearanceNote" role="status"></span>
          </span>
          <div class="appearance-choices" role="radiogroup" aria-labelledby="appearanceTitle">
            <label class="appearance-choice">
              <input type="radio" name="appearance" value="auto" />
              <span class="appearance-icon appearance-icon-auto" aria-hidden="true">
                <img src="icon-light-180.png" alt="" />
                <img src="icon-180.png" alt="" />
              </span>
              <span>System</span>
            </label>
            <label class="appearance-choice">
              <input type="radio" name="appearance" value="light" />
              <span class="appearance-icon" aria-hidden="true">
                <img src="icon-light-180.png" alt="" />
              </span>
              <span>Maple</span>
            </label>
            <label class="appearance-choice">
              <input type="radio" name="appearance" value="dark" />
              <span class="appearance-icon" aria-hidden="true">
                <img src="icon-180.png" alt="" />
              </span>
              <span>Walnut</span>
            </label>
          </div>
        </div>
      </div>
      <div class="home-screen-tip" id="homeScreenTip" hidden></div>
      <footer class="settings-footer">
        <p class="settings-version" id="versionNote" hidden data-last-drawn></p>
        <p class="settings-version">Includes data from NBA.com</p>
        <p class="settings-version">&copy; 2026 Noah Kaplan</p>
      </footer>
      <section class="diagnostics-area" aria-labelledby="diagnosticsTitle">
        <div class="control-row">
          <span class="control-label">
            <span id="diagnosticsTitle">Diagnostics</span>
          </span>
          <button
            type="button"
            role="switch"
            class="switch"
            id="diagnosticsSwitch"
            aria-checked="false"
            aria-labelledby="diagnosticsTitle"
          >
            <span class="switch-knob" aria-hidden="true"></span>
          </button>
        </div>
        <div class="diagnostics" id="diagnostics" hidden></div>
      </section>
    </div>
  </dialog>

  <dialog id="sheetDialog" class="sheet-panel" aria-labelledby="gameTitle">
    <div class="sheet-row">
      <section id="gameSheet" class="sheet-page game-sheet" aria-labelledby="gameTitle" hidden>
        <div class="sheet-content">
          <div class="sheet-top">
            <div class="sheet-head">
              <button type="button" class="sheet-close" id="gameCloseBtn">
                <!-- Phosphor's caret-down, at its Light weight. -->
                <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
                  <path
                    d="M212.24,100.24l-80,80a6,6,0,0,1-8.48,0l-80-80a6,6,0,0,1,8.48-8.48L128,167.51l75.76-75.75a6,6,0,0,1,8.48,8.48Z"
                  />
                </svg>
                <span class="sheet-close-label">Close</span>
              </button>
              <button type="button" class="sheet-back" id="gameBackBtn" hidden>
                <!-- Phosphor's arrow-left, at its Light weight. -->
                <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
                  <path
                    d="M222,128a6,6,0,0,1-6,6H54.49l61.75,61.76a6,6,0,1,1-8.48,8.48l-72-72a6,6,0,0,1,0-8.48l72-72a6,6,0,0,1,8.48,8.48L54.49,122H216A6,6,0,0,1,222,128Z"
                  />
                </svg>
                <span class="sheet-back-label">Back</span>
              </button>
              <div class="sheet-title">
                <h2 id="gameTitle" data-last-drawn>Game</h2>
                <p class="sheet-note" id="gameWhen" data-last-drawn></p>
              </div>
            </div>
            <div class="faceoff-slot" id="gameFaceOff" data-last-drawn></div>
            <div class="pager-tabs" role="tablist" aria-label="Game" hidden>
              <button
                type="button"
                role="tab"
                id="gameTabGame"
                data-tab="game"
                aria-controls="gameSection"
                aria-selected="true"
                class="active"
              >
                Game
              </button>
              <button
                type="button"
                role="tab"
                id="gameTabHighlights"
                data-tab="highlights"
                aria-controls="highlightsSection"
                aria-selected="false"
                tabindex="-1"
                hidden
              >
                Highlights
              </button>
            </div>
          </div>
        </div>
        <div class="sheet-sections">
          <div class="sheet-section" id="gameSection" role="tabpanel" aria-labelledby="gameTabGame">
            <div class="game-sheet-body" id="gameBody" data-last-drawn></div>
          </div>
          <div
            class="sheet-section"
            id="highlightsSection"
            role="tabpanel"
            aria-labelledby="gameTabHighlights"
          >
            <div class="game-sheet-body highlights-body" id="highlightsBody" data-last-drawn></div>
          </div>
        </div>
      </section>

      <section id="teamSheet" class="sheet-page" aria-labelledby="teamTitle" hidden>
        <div class="sheet-content">
          <div class="sheet-top">
            <div class="sheet-head">
              <button type="button" class="sheet-close" id="teamCloseBtn">
                <!-- Phosphor's caret-down, at its Light weight. -->
                <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
                  <path
                    d="M212.24,100.24l-80,80a6,6,0,0,1-8.48,0l-80-80a6,6,0,0,1,8.48-8.48L128,167.51l75.76-75.75a6,6,0,0,1,8.48,8.48Z"
                  />
                </svg>
                <span class="sheet-close-label">Close</span>
              </button>
              <button type="button" class="sheet-back" id="teamBackBtn" hidden>
                <!-- Phosphor's arrow-left, at its Light weight. -->
                <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
                  <path
                    d="M222,128a6,6,0,0,1-6,6H54.49l61.75,61.76a6,6,0,1,1-8.48,8.48l-72-72a6,6,0,0,1,0-8.48l72-72a6,6,0,0,1,8.48,8.48L54.49,122H216A6,6,0,0,1,222,128Z"
                  />
                </svg>
                <span class="sheet-back-label">Back</span>
              </button>
              <div class="sheet-title">
                <h2 id="teamTitle" class="team-title" data-last-drawn>Team</h2>
                <p class="sheet-note team-note" id="teamNote" data-last-drawn></p>
              </div>
            </div>
            <div class="pager-tabs" role="tablist" aria-label="Team">
              <button
                type="button"
                role="tab"
                id="teamTabTeam"
                data-tab="team"
                aria-controls="teamSection"
                aria-selected="true"
                class="active"
              >
                Team
              </button>
              <button
                type="button"
                role="tab"
                id="teamTabRoster"
                data-tab="roster"
                aria-controls="rosterSection"
                aria-selected="false"
                tabindex="-1"
              >
                Roster
              </button>
            </div>
          </div>
        </div>
        <div class="sheet-sections">
          <div class="sheet-section" id="teamSection" role="tabpanel" aria-labelledby="teamTabTeam">
            <div class="team-sheet-body" id="teamBody" data-last-drawn></div>
          </div>
          <div
            class="sheet-section roster-section"
            id="rosterSection"
            role="tabpanel"
            aria-labelledby="teamTabRoster"
          >
            <p class="sheet-note roster-note" id="rosterNote" data-last-drawn></p>
            <div class="roster-body" id="rosterBody" data-last-drawn></div>
          </div>
        </div>
      </section>

      <section
        id="playerSheet"
        class="sheet-page player-sheet"
        aria-labelledby="playerTitle"
        hidden
      >
        <div class="sheet-content">
          <div class="sheet-top">
            <div class="sheet-head">
              <button type="button" class="sheet-close" id="playerCloseBtn">
                <!-- Phosphor's caret-down, at its Light weight. -->
                <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
                  <path
                    d="M212.24,100.24l-80,80a6,6,0,0,1-8.48,0l-80-80a6,6,0,0,1,8.48-8.48L128,167.51l75.76-75.75a6,6,0,0,1,8.48,8.48Z"
                  />
                </svg>
                <span class="sheet-close-label">Close</span>
              </button>
              <button type="button" class="sheet-back" id="playerBackBtn" hidden>
                <!-- Phosphor's arrow-left, at its Light weight. -->
                <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
                  <path
                    d="M222,128a6,6,0,0,1-6,6H54.49l61.75,61.76a6,6,0,1,1-8.48,8.48l-72-72a6,6,0,0,1,0-8.48l72-72a6,6,0,0,1,8.48,8.48L54.49,122H216A6,6,0,0,1,222,128Z"
                  />
                </svg>
                <span class="sheet-back-label">Back</span>
              </button>
              <div class="sheet-title">
                <h2 id="playerTitle" class="team-title" data-last-drawn>Player</h2>
                <p class="sheet-note team-note" id="playerNote" data-last-drawn></p>
              </div>
            </div>
            <div class="player-facts-slot" id="playerFacts" data-last-drawn></div>
          </div>
          <div class="team-sheet-body player-body" id="playerBody" data-last-drawn></div>
        </div>
      </section>
    </div>
  </dialog>

  <script>
    openLastTab();
    showLastDrawn();
    watchSlowLoad();
  </script>

  <script type="module" src="js/app.js"></script>
</html>
