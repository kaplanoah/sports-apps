name = "email"
main = "dist/worker.mjs"
compatibility_date = "2026-09-01"
no_bundle = true
workers_dev = false

[observability]
enabled = true

[[durable_objects.bindings]]
name = "STORE"
class_name = "EmailOutbox"

[version_metadata]
binding = "VERSION"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EmailOutbox"]

[env.beta]
name = "email-beta"
workers_dev = false

[[env.beta.durable_objects.bindings]]
name = "STORE"
class_name = "EmailOutbox"

[env.beta.version_metadata]
binding = "VERSION"
